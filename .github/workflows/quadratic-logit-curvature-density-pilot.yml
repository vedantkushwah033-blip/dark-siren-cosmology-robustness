name: Quadratic-logit curvature paired density pilot
on:
  push:
    branches:
      - research/absolute-width-distribution-pilot-20261114
    paths:
      - "scripts/run_quadratic_logit_curvature_density_pilot.py"
      - "scripts/audit_quadratic_logit_curvature_density_pilot.py"
      - "scripts/run_quadratic_logit_curvature_density_smoke.py"
      - "scripts/audit_quadratic_logit_curvature_density_smoke.py"
      - "src/dark_siren_robustness/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run seven-gamma paired density pilot
        run: python scripts/run_quadratic_logit_curvature_density_pilot.py --output-dir output/quadratic_logit_curvature_density_pilot --replicates 3 --seed 2026111500
      - name: Independently audit all children and aggregate
        run: python scripts/audit_quadratic_logit_curvature_density_pilot.py output/quadratic_logit_curvature_density_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quadratic-logit-curvature-density-pilot
          path: output/quadratic_logit_curvature_density_pilot/
          if-no-files-found: warn
          retention-days: 30
