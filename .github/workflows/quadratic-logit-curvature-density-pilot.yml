name: Quadratic-logit curvature paired density pilot
on:
  # This multi-replicate simulation is deliberately manual-only. Ordinary
  # code pushes should run tests, not repeatedly launch a 180-minute pilot.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run seven-gamma paired density pilot
        run: >-
          python scripts/run_quadratic_logit_curvature_density_replicates.py
          --output-dir output/quadratic_logit_curvature_density_pilot
          --replicates 3 --master-seed 2026111500
          --gammas=-2,-1,-0.5,0,0.5,1,2
          --n-parent 4000 --validation-frame 1500
          --validation-sizes 100,300,1000
          --quadrature-order 5 --grid-points 401
          --absolute-widths 0.008,0.012,0.016,0.024,0.032,0.040,0.050,0.060,0.080
      - name: Independently audit all children, aggregates, and paired contrasts
        run: python scripts/audit_quadratic_logit_curvature_density_replicates.py output/quadratic_logit_curvature_density_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quadratic-logit-curvature-density-pilot
          path: output/quadratic_logit_curvature_density_pilot/
          if-no-files-found: warn
          retention-days: 30
