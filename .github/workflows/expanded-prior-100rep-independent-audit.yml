name: expanded-prior-100rep-independent-audit

on:
  push:
    branches:
      - research/expanded-prior-100rep-independent-audit-20261120
    paths:
      - .github/workflows/expanded-prior-100rep-independent-audit.yml
      - scripts/audit_expanded_prior_100rep_pair.py
      - tests/test_expanded_prior_100rep_audit.py
  pull_request:
    branches:
      - research/five-arm-expanded-h0-prior-20261119
    paths:
      - .github/workflows/expanded-prior-100rep-independent-audit.yml
      - scripts/audit_expanded_prior_100rep_pair.py
      - scripts/audit_quadratic_five_arm_replicates.py
      - tests/test_expanded_prior_100rep_audit.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: expanded-prior-100rep-independent-audit
  cancel-in-progress: false

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile independent audit
        run: |
          python -m py_compile \
            scripts/audit_expanded_prior_100rep_pair.py \
            scripts/audit_quadratic_five_arm_replicates.py
      - name: Run focused audit regression tests
        run: pytest tests/test_expanded_prior_100rep_audit.py -q
      - name: Download first independent 100-replicate stream
        uses: actions/download-artifact@v4
        with:
          name: quadratic-five-arm-30event-wide-prior-100rep
          run-id: 44483923518
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: artifacts/seed_2026111940
      - name: Download second independent 100-replicate stream
        uses: actions/download-artifact@v4
        with:
          name: quadratic-five-arm-30event-wide-prior-paired-seed-100rep
          run-id: 44484212311
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: artifacts/seed_2026111929
      - name: Verify both archives and reconstruct all posterior summaries
        run: |
          python scripts/audit_expanded_prior_100rep_pair.py \
            --seed1940 artifacts/seed_2026111940 \
            --seed1929 artifacts/seed_2026111929 \
            --auditor scripts/audit_quadratic_five_arm_replicates.py \
            --output-dir artifacts/independent_200rep_readout
      - name: Upload independent audit and pooled readout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-prior-independent-200rep-audit
          path: artifacts/independent_200rep_readout/
          if-no-files-found: warn
          retention-days: 90
