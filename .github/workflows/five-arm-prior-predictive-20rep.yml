name: Five-arm prior-predictive SBC 20-replicate pilot

on:
  push:
    branches:
      - research/five-arm-prior-predictive-20rep-20261120
  pull_request:
    paths:
      - "scripts/run_quadratic_five_arm_replicates.py"
      - "scripts/audit_quadratic_five_arm_replicates.py"
      - "scripts/run_quadratic_five_arm_smoke.py"
      - "scripts/audit_quadratic_five_arm_smoke.py"
      - "scripts/summarize_prior_predictive_sbc.py"
      - "tests/test_quadratic_five_arm_replicates.py"
      - "tests/test_prior_predictive_sbc_summary.py"
      - ".github/workflows/five-arm-prior-predictive-20rep.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prior-predictive-20rep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test truth stream, posterior ranks, and fail-closed SBC summaries
        run: python -m pytest -q tests/test_quadratic_five_arm_replicates.py tests/test_prior_predictive_sbc_summary.py
      - name: Run 20-replicate prior-predictive five-arm experiment
        run: |
          python scripts/run_quadratic_five_arm_replicates.py \
            --master-seed 2026112021 \
            --replicates 20 \
            --truth-mode prior_predictive \
            --gammas=-1,0,1 \
            --n-parent 1200 \
            --n-detected 30 \
            --validation-frame 500 \
            --validation-sizes 100,300,500 \
            --h0-prior-min 30 \
            --h0-prior-max 110 \
            --h0-points 561 \
            --quadrature-order 5 \
            --output-dir artifacts/five_arm_prior_predictive_20rep
      - name: Independently audit all 60 child runs and aggregate outputs
        run: |
          python scripts/audit_quadratic_five_arm_replicates.py \
            artifacts/five_arm_prior_predictive_20rep \
            --output artifacts/five_arm_prior_predictive_20rep/independent_audit.json
      - name: Summarize prior-predictive ranks and central-interval coverage
        run: |
          python scripts/summarize_prior_predictive_sbc.py \
            artifacts/five_arm_prior_predictive_20rep \
            --output-dir artifacts/five_arm_prior_predictive_20rep_sbc_summary
      - name: Verify all audited outputs exist
        if: always()
        run: |
          test -f artifacts/five_arm_prior_predictive_20rep/manifest.json
          test -f artifacts/five_arm_prior_predictive_20rep/independent_audit.json
          test -f artifacts/five_arm_prior_predictive_20rep_sbc_summary/summary_report.json
      - name: Upload prior-predictive 20-replicate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-arm-prior-predictive-20rep
          path: artifacts/
          if-no-files-found: error
