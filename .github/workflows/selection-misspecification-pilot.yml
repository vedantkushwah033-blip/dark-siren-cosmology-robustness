name: selection-misspecification-pilot

on:
  push:
    branches:
      - research/audit-posterior-grid-integrity
  pull_request:
    branches:
      - main
    paths:
      - "src/dark_siren_robustness/selection_misspecification.py"
      - "src/dark_siren_robustness/catalogue_density.py"
      - "src/dark_siren_robustness/selection_toy.py"
      - "src/dark_siren_robustness/generative_selection.py"
      - "scripts/run_selection_misspecification.py"
      - "scripts/audit_selection_misspecification.py"
      - "docs/preregistered_host_density_validation_protocol.md"
      - ".github/workflows/selection-misspecification-pilot.yml"

permissions:
  contents: read

concurrency:
  group: selection-misspecification-pilot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run preregistered Stage A pilot (200 paired replicates)
        run: >-
          python scripts/run_selection_misspecification.py
          --replicates 200
          --n-parent 4000
          --n-detected 30
          --seed 20261030
          --h0-points 81
          --z-points 401
          --output-dir artifacts/selection_misspecification_stage_a
      - name: Independently reconstruct posterior grids and audit artifacts
        run: python scripts/audit_selection_misspecification.py artifacts/selection_misspecification_stage_a
      - name: Upload raw data, summary, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: selection-misspecification-stage-a-${{ github.sha }}
          path: artifacts/selection_misspecification_stage_a/
          if-no-files-found: error
          retention-days: 90
