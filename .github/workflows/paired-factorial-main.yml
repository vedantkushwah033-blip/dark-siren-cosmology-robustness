name: Paired factorial main experiment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paired-factorial-main.yml"
      - "scripts/run_paired_factorial_sensitivity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-factorial-main:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest
      - name: Clone pinned original simulator
        run: |
          git clone https://github.com/vedantkushwah033-blip/bayesian-dark-siren-cosmology.git original-project
          git -C original-project checkout b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f
          python -m pip install -r original-project/requirements.txt
      - name: Validate experiment design
        run: python -m pytest -q tests/test_paired_factorial_sensitivity.py
      - name: Run 300-replicate paired factorial experiment
        run: |
          python scripts/run_paired_factorial_sensitivity.py \
            --original-dir original-project \
            --replicates 300 \
            --seed 20261023 \
            --output-dir results/paired-factorial-main
      - name: Validate and summarize main results
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results/paired-factorial-main")
          meta = json.loads((root / "scenario_summary.json").read_text())
          def read(name):
              with (root / name).open(newline="") as f:
                  return list(csv.DictReader(f))
          summaries, runs, contrasts = read("scenario_summary.csv"), read("per_run_results.csv"), read("paired_contrasts.csv")
          if meta["scenario_count"] != 9 or meta["contrast_count"] != 49:
              raise SystemExit("Metadata scenario/contrast counts are incorrect")
          if meta["requested_replicates_per_scenario"] != 300:
              raise SystemExit("Requested replicate count mismatch")
          if len(summaries) != 9 or len(runs) != 2700 or len(contrasts) != 49 * 300 // 30:
              raise SystemExit(f"Unexpected row counts: summary={len(summaries)}, runs={len(runs)}, contrasts={len(contrasts)}")
          counts = {}
          for row in runs:
              counts[row["scenario"]] = counts.get(row["scenario"], 0) + 1
              for key in ("median", "mean", "posterior_sd", "lower_68", "upper_68", "lower_95", "upper_95", "realized_completeness"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite {key}: {row}")
              if float(row["lower_68"]) > float(row["upper_68"]) or float(row["lower_95"]) > float(row["upper_95"]):
                  raise SystemExit("Credible interval endpoints reversed")
          if len(counts) != 9 or any(v != 300 for v in counts.values()):
              raise SystemExit(f"Wrong replicate counts: {counts}")
          if any(int(row["n_pairs"]) != 300 for row in contrasts):
              raise SystemExit("Paired contrast does not contain 300 pairs")
          print("VALIDATED: 9 scenarios × 300 replicates = 2,700 per-run records.")
          print("VALIDATED: 49 prespecified contrasts × 7 metrics = 49 contrast rows with 300 paired universes each.")
          for row in summaries:
              print(json.dumps({k: row[k] for k in ("scenario", "median_bias", "mean_bias", "rmse_median", "rmse_mean", "coverage_68", "coverage_95", "mean_width_68", "mean_width_95", "host_observed_fraction")}))
          PY
      - name: Upload full experiment results
        uses: actions/upload-artifact@v4
        with:
          name: paired-factorial-main-300-replicates
          path: results/paired-factorial-main/
          if-no-files-found: error
          retention-days: 90
