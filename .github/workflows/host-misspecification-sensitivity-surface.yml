name: Paired host-misspecification sensitivity surface

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/run_host_misspecification_sensitivity_surface.py"
      - "scripts/audit_host_misspecification_sensitivity_surface.py"
      - "tests/test_host_misspecification_sensitivity_surface.py"
      - "docs/host_misspecification_sensitivity_surface_protocol.md"
      - "docs/missing_host_mixture_likelihood_impact_audit_2026-10-27.md"
      - ".github/workflows/host-misspecification-sensitivity-surface.yml"
  pull_request:
    paths:
      - "scripts/run_host_misspecification_sensitivity_surface.py"
      - "scripts/audit_host_misspecification_sensitivity_surface.py"
      - "tests/test_host_misspecification_sensitivity_surface.py"
      - "docs/host_misspecification_sensitivity_surface_protocol.md"
      - "docs/missing_host_mixture_likelihood_impact_audit_2026-10-27.md"
      - ".github/workflows/host-misspecification-sensitivity-surface.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-sensitivity-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused factorial and adversarial-audit tests
        run: python -m pytest tests/test_host_misspecification_sensitivity_surface.py -q
      - name: Run full paired factorial
        run: |
          python scripts/run_host_misspecification_sensitivity_surface.py \
            --replicates 200 \
            --seed 20261029 \
            --bootstrap-resamples 1000 \
            --output-dir results/host-misspecification-sensitivity-surface
      - name: Validate design shape, paired records, and finite metrics
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root = Path("results/host-misspecification-sensitivity-surface")
          def read(name):
              with (root / name).open(newline="", encoding="utf-8") as f:
                  return list(csv.DictReader(f))
          raw, summary, contrasts = read("per_run.csv"), read("summary.csv"), read("paired_contrasts.csv")
          if (len(raw), len(summary), len(contrasts)) != (86400, 432, 1296):
              raise SystemExit(f"Unexpected sizes: raw={len(raw)}, summary={len(summary)}, contrasts={len(contrasts)}")
          for start in range(0, len(raw), 4):
              block = raw[start:start+4]
              if tuple(r["inference_arm"] for r in block) != ("base_weights", "reversed_weights", "equal_weights", "hidden_host_modelled"):
                  raise SystemExit(f"Incorrect inference-arm order near raw row {start}")
              if len({r["observed_distance_mpc"] for r in block}) != 1:
                  raise SystemExit(f"Unpaired distance near raw row {start}")
          for row in summary + contrasts:
              for key, value in row.items():
                  if key not in ("inference_arm", "contrast", "left_arm", "right_arm", "metric"):
                      if not math.isfinite(float(value)):
                          raise SystemExit(f"Non-finite value in {key}: {value}")
              if "ci95_low" in row and float(row["ci95_low"]) > float(row["ci95_high"]):
                  raise SystemExit("Reversed bootstrap interval")
          print("PASS: 108 cells × 200 observations × 4 arms = 86,400 fits; 1,296 paired contrast rows.")
          PY
      - name: Independently reconstruct raw observations, posterior fits, summaries, and paired intervals
        run: |
          python scripts/audit_host_misspecification_sensitivity_surface.py \
            --replicates 200 \
            --seed 20261029 \
            --bootstrap-resamples 1000 \
            --input-dir results/host-misspecification-sensitivity-surface
      - name: Upload full factorial outputs
        uses: actions/upload-artifact@v4
        with:
          name: host-misspecification-sensitivity-surface
          path: results/host-misspecification-sensitivity-surface/
          if-no-files-found: error
          retention-days: 90
