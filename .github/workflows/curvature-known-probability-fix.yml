name: curvature-known-probability-fix

on:
  push:
    branches:
      - research/curvature-known-probability-fix-20261114
    paths:
      - src/dark_siren_robustness/five_arm_comparison.py
      - scripts/run_absolute_bandwidth_density_smoke.py
      - scripts/audit_absolute_bandwidth_density_smoke.py
      - scripts/audit_quadratic_logit_curvature_pilot.py
      - scripts/run_absolute_bandwidth_density_replicates.py
      - tests/test_five_arm_comparison.py
      - tests/test_absolute_bandwidth_density_smoke.py
      - tests/test_absolute_bandwidth_density_replicates.py
      - tests/test_generative_selection.py
      - tests/test_curvature_cross_gamma_completeness.py
      - .github/workflows/curvature-known-probability-fix.yml
  pull_request:
    branches:
      - research/absolute-width-distribution-pilot-20261114
    paths:
      - src/dark_siren_robustness/five_arm_comparison.py
      - scripts/run_absolute_bandwidth_density_smoke.py
      - scripts/audit_absolute_bandwidth_density_smoke.py
      - scripts/audit_quadratic_logit_curvature_pilot.py
      - scripts/run_absolute_bandwidth_density_replicates.py
      - tests/test_five_arm_comparison.py
      - tests/test_absolute_bandwidth_density_smoke.py
      - tests/test_absolute_bandwidth_density_replicates.py
      - tests/test_generative_selection.py
      - tests/test_curvature_cross_gamma_completeness.py
      - .github/workflows/curvature-known-probability-fix.yml

concurrency:
  group: curvature-known-probability-fix-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test five-arm weights, explicit truth probabilities, and entropy ESS
        run: python -m pytest tests/test_five_arm_comparison.py -q
      - name: Test independent raw-input density and weight-diagnostic audit
        run: python -m pytest tests/test_absolute_bandwidth_density_smoke.py -q
      - name: Test multi-replicate density runner and auditor
        run: python -m pytest tests/test_absolute_bandwidth_density_replicates.py -q
      - name: Test synthetic quadratic-logit DGP invariants
        run: python -m pytest tests/test_generative_selection.py -q
      - name: Test cross-gamma pilot completeness gate
        run: python -m pytest tests/test_curvature_cross_gamma_completeness.py -q
