name: Toy single-host fixed-truth selection control

on:
  push:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/selection.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_single_host_fixed_truth_control.py"
      - "tests/test_single_host_fixed_truth_control.py"
      - ".github/workflows/single-host-fixed-truth-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-host-control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused tests
        run: python -m pytest tests/test_single_host_fixed_truth_control.py -q
      - name: Run prespecified single-host control
        run: python scripts/run_single_host_fixed_truth_control.py --replicates 300 --seed 20261030 --grid-size 4001 --bootstrap-draws 5000 --output-dir results/single-host-fixed-truth-control
      - name: Validate artifacts
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results/single-host-fixed-truth-control")
          with (root / "per_run.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          with (root / "summary.csv").open(newline="") as f:
              summaries = list(csv.DictReader(f))
          manifest = json.loads((root / "experiment_manifest.json").read_text())
          if len(rows) != 2700 or len(summaries) != 27:
              raise SystemExit(f"Unexpected dimensions: {len(rows)} runs, {len(summaries)} summaries")
          if manifest["raw_rows"] != len(rows) or manifest["summary_rows"] != len(summaries):
              raise SystemExit("Manifest row counts do not match CSV artifacts")
          for row in rows:
              d = float(row["observed_distance_mpc"])
              if not 0 < d < 180:
                  raise SystemExit("Observation outside detection interval")
              for key in ("uncorrected_median", "corrected_median", "paired_abs_error_change_corrected_minus_uncorrected"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite field: {key}")
          for row in summaries:
              for key in ("bias", "mae", "rmse", "coverage_68", "coverage_95"):
                  if key in row and row[key] != "" and not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite summary field: {key}")
          print("PASS: 2,700 paired rows, 27 summaries, and manifest validated.")
          PY
      - name: Upload control results
        uses: actions/upload-artifact@v4
        with:
          name: single-host-fixed-truth-control-results
          path: results/single-host-fixed-truth-control/
          if-no-files-found: error
          retention-days: 90
