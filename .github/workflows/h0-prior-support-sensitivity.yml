name: H0 prior-support sensitivity for low-tail SBC replicates

on:
  push:
    branches:
      - research/h0-prior-support-sensitivity-20261119
  pull_request:
    branches:
      - research/full-parent-joint-sbc-baseline-20261119
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: h0-prior-support-sensitivity-20261119
  cancel-in-progress: false

jobs:
  support-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile and test support-sensitivity calculations
        run: |
          python -m py_compile scripts/audit_full_parent_h0_sbc_prior_support.py
          PYTHONPATH=scripts pytest -q tests/test_full_parent_h0_sbc_prior_support.py
      - name: Verify immutable source SBC workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(gh api repos/vedantkushwah033-blip/dark-siren-cosmology-robustness/actions/runs/44446994455 --jq '.status + ":" + (.conclusion // "")')
          test "$result" = "completed:success"
      - name: Download immutable 1000-replicate source artifact
        uses: actions/download-artifact@v4
        with:
          name: full-parent-h0-sbc-1000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44446994455
          path: artifacts/full_parent_h0_sbc_1000
      - name: Reconstruct and compare adaptive posteriors under expanded lower supports
        run: |
          PYTHONPATH=scripts python scripts/audit_full_parent_h0_sbc_prior_support.py artifacts/full_parent_h0_sbc_1000 \
            --selected-count 10 \
            --alternative-lower-bounds 10 15 \
            --grid-points 4481 \
            --output artifacts/h0_prior_support_sensitivity.json
      - name: Upload support-sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0-prior-support-sensitivity-20261119
          path: artifacts/h0_prior_support_sensitivity.json
          if-no-files-found: warn
          retention-days: 90
