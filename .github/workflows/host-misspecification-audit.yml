name: Host-weight and omitted-host misspecification audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_host_misspecification_audit.py"
      - "scripts/audit_host_misspecification_audit.py"
      - "tests/test_host_misspecification_audit.py"
      - ".github/workflows/host-misspecification-audit.yml"
  pull_request:
    paths:
      - "scripts/run_host_misspecification_audit.py"
      - "scripts/audit_host_misspecification_audit.py"
      - "tests/test_host_misspecification_audit.py"
      - ".github/workflows/host-misspecification-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-misspecification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run stress test
        run: |
          python scripts/run_host_misspecification_audit.py \
            --replicates 1000 \
            --seed 20261027 \
            --output-dir results/host-misspecification-audit
      - name: Validate result files
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root = Path("results/host-misspecification-audit")
          with (root / "summary.csv").open(newline="") as f:
              summary = list(csv.DictReader(f))
          with (root / "per_run.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          if len(summary) != 4 or len(rows) != 4000:
              raise SystemExit(f"Unexpected output sizes: {len(summary)} summaries, {len(rows)} rows")
          for row in summary:
              for key in ("mean_median_error", "rmse_median", "coverage_68", "coverage_95", "mean_width_68", "mean_width_95"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite metric: {key}")
              if not 0 <= float(row["coverage_68"]) <= 1 or not 0 <= float(row["coverage_95"]) <= 1:
                  raise SystemExit("Coverage outside [0,1]")
          print("PASS: 4 scenarios × 1,000 replicates = 4,000 posterior fits.")
          PY
      - name: Independently reconstruct seeded data, posterior fits, and summaries
        run: |
          python scripts/audit_host_misspecification_audit.py \
            --replicates 1000 \
            --seed 20261027 \
            --input-dir results/host-misspecification-audit
      - name: Upload stress-test results
        uses: actions/upload-artifact@v4
        with:
          name: host-misspecification-audit-results
          path: results/host-misspecification-audit/
          if-no-files-found: error
          retention-days: 90
