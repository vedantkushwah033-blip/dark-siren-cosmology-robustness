name: paired-degree-multireplicate-pilot

on:
  push:
    branches:
      - research/paired-degree-multireplicate-20261120
    paths:
      - "scripts/run_paired_degree_multireplicate_pilot.py"
      - "scripts/audit_degree_prior_parameterization.py"
      - "scripts/audit_paired_degree_multireplicate_pilot.py"
      - "scripts/run_quadratic_five_arm_replicates.py"
      - "scripts/audit_quadratic_five_arm_replicates.py"
      - "scripts/run_quadratic_five_arm_smoke.py"
      - "scripts/audit_quadratic_five_arm_smoke.py"
      - "tests/test_paired_degree_multireplicate_pilot.py"
      - ".github/workflows/paired-degree-multireplicate-pilot.yml"
  pull_request:
    paths:
      - "scripts/run_paired_degree_multireplicate_pilot.py"
      - "scripts/audit_degree_prior_parameterization.py"
      - "scripts/audit_paired_degree_multireplicate_pilot.py"
      - "scripts/run_quadratic_five_arm_replicates.py"
      - "scripts/audit_quadratic_five_arm_replicates.py"
      - "scripts/run_quadratic_five_arm_smoke.py"
      - "scripts/audit_quadratic_five_arm_smoke.py"
      - "tests/test_paired_degree_multireplicate_pilot.py"
      - ".github/workflows/paired-degree-multireplicate-pilot.yml"

concurrency:
  group: paired-degree-multireplicate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  paired-degree-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Audit raw-versus-centered degree-two prior mapping
        run: python scripts/audit_degree_prior_parameterization.py
      - name: Test paired-degree orchestration and invariance gates
        run: python -m pytest tests/test_paired_degree_multireplicate_pilot.py tests/test_quadratic_five_arm_replicates.py -q
      - name: Run paired degree-one/degree-two multi-replicate pilot
        run: |
          python scripts/run_paired_degree_multireplicate_pilot.py \
            --master-seed 20261120 --replicates 3 --gammas=-1,0,1 \
            --n-parent 1200 --n-detected 30 --validation-frame 500 \
            --validation-sizes 100,500 --h0-true 70 \
            --h0-prior-min 30 --h0-prior-max 110 --h0-points 281 \
            --quadrature-order 5 \
            --output-dir artifacts/paired_degree_multireplicate
      - name: Independently audit paired-degree artifact
        if: success()
        run: |
          python scripts/audit_paired_degree_multireplicate_pilot.py \
            artifacts/paired_degree_multireplicate \
            --output artifacts/paired_degree_multireplicate/independent_audit_report.json
      - name: Upload paired-degree pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-degree-multireplicate-pilot
          path: artifacts/paired_degree_multireplicate/
          if-no-files-found: warn
