name: paired-degree-eight-replicate-followup

on:
  push:
    branches:
      - research/paired-degree-eight-replicate-followup-20261121
    paths:
      - .github/workflows/paired-degree-eight-replicate-followup.yml
      - scripts/run_paired_degree_multireplicate_pilot.py
      - scripts/audit_paired_degree_multireplicate_pilot.py
      - scripts/run_quadratic_five_arm_replicates.py
      - scripts/audit_quadratic_five_arm_replicates.py
      - scripts/run_quadratic_five_arm_smoke.py
      - scripts/audit_quadratic_five_arm_smoke.py
      - tests/test_paired_degree_multireplicate_pilot.py

permissions:
  contents: read

concurrency:
  group: paired-degree-eight-replicate-followup
  cancel-in-progress: false

jobs:
  paired-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/paired-degree-eight-replicate-followup-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test paired-degree runner and independent auditor
        run: python -m pytest tests/test_paired_degree_multireplicate_pilot.py -q
      - name: Run eight-replicate paired degree-one/degree-two five-arm follow-up
        run: |
          python scripts/run_paired_degree_multireplicate_pilot.py \
            --master-seed 2026112121 --replicates 8 --gammas=-1,0,1 \
            --n-parent 1200 --n-detected 30 --validation-frame 500 \
            --validation-sizes 100,300,500 --curvature-beta -3.9 \
            --h0-true 70 --h0-prior-min 50 --h0-prior-max 90 \
            --h0-points 281 --scott-multiplier 0.7 --quadrature-order 5 \
            --sigma-mpc 140 --detection-threshold-mpc 250 \
            --output-dir artifacts/paired_degree_eight_replicates
      - name: Independently audit eight-replicate paired artifacts
        run: |
          python scripts/audit_paired_degree_multireplicate_pilot.py \
            artifacts/paired_degree_eight_replicates \
            --output artifacts/paired_degree_eight_replicates/independent_audit.json
      - name: Assert complete lifecycle and paired design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/paired_degree_eight_replicates")
          cfg = json.loads((root / "config.json").read_text())
          audit = json.loads((root / "independent_audit.json").read_text())
          assert cfg["status"] == "PASS", cfg["status"]
          assert audit["status"] == "PASS", audit["status"]
          assert cfg["replicates"] == 8
          assert cfg["gammas"] == [-1.0, 0.0, 1.0]
          assert cfg["n_parent"] == 1200 and cfg["n_detected"] == 30
          assert audit["paired_child_blocks_verified"] == 8 * 3
          assert audit["paired_summary_rows_reconstructed"] == 8 * 3 * 3 * 5
          assert audit["paired_aggregate_rows_reconstructed"] == 3 * 3 * 5
          print(json.dumps({"status":"PASS","paired_child_blocks":audit["paired_child_blocks_verified"],
                            "paired_summary_rows":audit["paired_summary_rows_reconstructed"],
                            "paired_aggregate_rows":audit["paired_aggregate_rows_reconstructed"]},
                           indent=2))
          PY
      - name: Upload eight-replicate paired evidence
        uses: actions/upload-artifact@v4
        with:
          name: paired-degree-30event-eight-replicate-followup
          path: artifacts/paired_degree_eight_replicates/
          if-no-files-found: error
          retention-days: 90
