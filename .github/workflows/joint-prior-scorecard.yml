name: Joint prior-performance scorecard
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_joint_prior_scorecard.py"
      - "scripts/run_prior_support_sensitivity.py"
      - "scripts/run_prior_interval_width_sensitivity.py"
      - "scripts/run_fixed_truth_coverage_map.py"
      - "tests/test_joint_prior_scorecard.py"
      - ".github/workflows/joint-prior-scorecard.yml"
      - "src/dark_siren_robustness/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run joint scorecard
        run: python scripts/run_joint_prior_scorecard.py --replicates 300 --seed 20261024 --grid-size 4001 --output results/joint-prior-scorecard.csv
      - name: Run focused tests
        run: python -m pytest tests/test_joint_prior_scorecard.py -q
      - name: Upload scorecard
        uses: actions/upload-artifact@v4
        with:
          name: joint-prior-scorecard-python-${{ matrix.python-version }}
          path: results/joint-prior-scorecard.csv
          if-no-files-found: error
          retention-days: 90
