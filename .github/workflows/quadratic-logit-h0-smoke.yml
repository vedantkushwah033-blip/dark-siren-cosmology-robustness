name: quadratic-logit-h0-smoke

on:
  push:
    branches:
      - research/quadratic-logit-h0-smoke-20261119
    paths:
      - .github/workflows/quadratic-logit-h0-smoke.yml
      - scripts/run_quadratic_logit_inclusion_h0_smoke.py
      - scripts/audit_quadratic_logit_inclusion_h0_smoke.py
      - src/dark_siren_robustness/**
  pull_request:
    paths:
      - .github/workflows/quadratic-logit-h0-smoke.yml
      - scripts/run_quadratic_logit_inclusion_h0_smoke.py
      - scripts/audit_quadratic_logit_inclusion_h0_smoke.py
      - src/dark_siren_robustness/**

permissions:
  contents: read

concurrency:
  group: quadratic-logit-h0-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  matched-quadratic-logit-h0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run matched quadratic-logit H0 smoke
        run: |
          python scripts/run_quadratic_logit_inclusion_h0_smoke.py \
            --seed 2026111903 --validation-seed 2026111904 \
            --n-parent 1200 --n-detected 4 \
            --n-validation-frame 500 --n-validation 150 \
            --catalogue-model quadratic_logit --curvature-gamma 1.0 \
            --degree 1 --orders 3,5,7,9 \
            --prior-min 20 --prior-max 160 --h0-points 141 \
            --density-tolerance 0.01 --quantile-tolerance 0.5 \
            --consecutive-passes 1 \
            --output-dir artifacts/quadratic_logit_h0_smoke
      - name: Independently audit matched quadratic-logit H0 artifacts
        run: |
          python scripts/audit_quadratic_logit_inclusion_h0_smoke.py \
            artifacts/quadratic_logit_h0_smoke \
            --output artifacts/quadratic_logit_h0_smoke/independent_audit_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/quadratic_logit_h0_smoke")
          cfg = json.loads((root / "config.json").read_text())
          audit = json.loads((root / "independent_audit_report.json").read_text())
          convergence = json.loads((root / "quadrature_convergence.json").read_text())
          assert cfg["analysis_generator_config"]["catalogue_selection_model"] == "quadratic_logit"
          assert cfg["analysis_generator_config"]["catalogue_selection"]["gamma"] == 1.0
          assert audit["status"] == "PASS"
          assert convergence["status"] == "CONVERGED"
          assert audit["selected_events_reconstructed"] == 4
          PY
      - name: Upload matched quadratic-logit H0 smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-logit-h0-smoke
          path: artifacts/quadratic_logit_h0_smoke/
          if-no-files-found: error
