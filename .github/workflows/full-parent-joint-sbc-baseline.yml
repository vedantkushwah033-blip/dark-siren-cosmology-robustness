name: full-parent-joint-sbc-baseline

on:
  pull_request:
    paths:
      - .github/workflows/full-parent-joint-sbc-baseline.yml
      - scripts/run_full_parent_h0_sbc.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-parent-joint-sbc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-parent-sbc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile scripts and run synthetic roundtrip tests
        run: |
          python -m py_compile scripts/run_full_parent_h0_sbc.py scripts/audit_full_parent_h0_sbc.py
          pytest tests/test_full_parent_h0_sbc.py -q
      - name: Run 200-replicate full-parent prior-predictive SBC
        run: |
          python scripts/run_full_parent_h0_sbc.py \
            --output-dir artifacts/full_parent_h0_sbc \
            --replicates 200 \
            --master-seed 2026111907 \
            --n-parent 1200 \
            --n-detected 30 \
            --h0-min 20 \
            --h0-max 300 \
            --h0-points 561
      - name: Independently regenerate all priors, parent populations, events, and posterior ranks
        run: |
          python scripts/audit_full_parent_h0_sbc.py artifacts/full_parent_h0_sbc \
            --expected-replicates 200 \
            --output artifacts/full_parent_h0_sbc/independent_audit.json
      - name: Verify rank and coverage summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path("artifacts/full_parent_h0_sbc")
          rows=pd.read_csv(root/"sbc_replicates.csv")
          summary=json.loads((root/"sbc_summary.json").read_text())
          audit=json.loads((root/"independent_audit.json").read_text())
          assert len(rows)==200 and rows.replicate.nunique()==200
          assert audit["status"]=="PASS"
          assert rows.posterior_rank.between(0,1).all()
          assert np.isfinite(rows.posterior_rank).all()
          assert abs(summary["mean_rank"]-rows.posterior_rank.mean())<1e-12
          for level in (50,68,80,90,95):
              assert abs(summary[f"coverage{level}"]-rows[f"covered{level}"].mean())<1e-12
          print(json.dumps(summary,indent=2))
          print(json.dumps(audit,indent=2))
          PY
      - name: Refresh aggregate manifest and upload full SBC evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("artifacts/full_parent_h0_sbc")
          if root.exists():
              manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"}
              (root/"manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload full SBC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-parent-h0-sbc
          path: artifacts/full_parent_h0_sbc/
          if-no-files-found: warn
          retention-days: 90
