name: h0-calibration-summary-audit-tests

on:
  push:
    branches:
      - research/h0-calibration-summary-audit-20261119
    paths:
      - scripts/audit_quadratic_logit_h0_calibration_pilot.py
      - tests/test_quadratic_logit_h0_calibration_pilot_audit.py
      - .github/workflows/h0-calibration-summary-audit-tests.yml
  pull_request:
    paths:
      - scripts/audit_quadratic_logit_h0_calibration_pilot.py
      - tests/test_quadratic_logit_h0_calibration_pilot_audit.py
      - .github/workflows/h0-calibration-summary-audit-tests.yml

jobs:
  audit-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run H0 calibration summary audit regression tests
        run: pytest tests/test_quadratic_logit_h0_calibration_pilot_audit.py -q
