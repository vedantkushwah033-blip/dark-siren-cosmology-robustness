name: Noise-scale consistency audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_noise_scale_consistency_audit.py"
      - "tests/test_noise_scale_consistency_audit.py"
      - ".github/workflows/noise-scale-consistency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noise-scale-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pytest
      - name: Run unit tests
        run: python -m pytest -q tests/test_noise_scale_consistency_audit.py
      - name: Run matched-noise sensitivity audit
        run: |
          python scripts/run_noise_scale_consistency_audit.py \
            --replicates 1000 \
            --seed 20261025 \
            --fractional-sigma 0.15 \
            --output-dir results/noise-scale-consistency
      - name: Validate outputs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path("results/noise-scale-consistency")
          with (root / "summary.csv").open(newline="") as f:
              summary = list(csv.DictReader(f))
          with (root / "per_run.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(summary) == 14, len(summary)
          assert len(rows) == 14000, len(rows)
          assert all(int(r["replicates"]) == 1000 for r in summary)
          print(f"Validated {len(summary)} summary rows and {len(rows)} posterior fits.")
          PY
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: noise-scale-consistency-audit
          path: results/noise-scale-consistency/
          if-no-files-found: error
          retention-days: 30
