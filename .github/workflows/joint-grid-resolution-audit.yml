name: Joint posterior grid-resolution audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_joint_grid_resolution_audit.py"
      - "scripts/run_joint_distance_model_host_mixture.py"
      - "src/dark_siren_robustness/cosmology.py"
      - "src/dark_siren_robustness/cosmological_inference.py"
      - "tests/test_joint_grid_resolution_audit.py"
      - ".github/workflows/joint-grid-resolution-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_joint_grid_resolution_audit.py"
      - "scripts/run_joint_distance_model_host_mixture.py"
      - "src/dark_siren_robustness/cosmology.py"
      - "src/dark_siren_robustness/cosmological_inference.py"
      - "tests/test_joint_grid_resolution_audit.py"
      - ".github/workflows/joint-grid-resolution-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused tests
        run: python -m pytest -q tests/test_joint_grid_resolution_audit.py tests/test_joint_distance_model_host_mixture.py tests/test_cosmological_inference.py
      - name: Run paired grid-resolution audit
        run: python scripts/run_joint_grid_resolution_audit.py --replicates 30 --seed 20261025 --output-dir results/grid-resolution-audit
      - name: Validate artifact shape and finite differences
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root=Path("results/grid-resolution-audit")
          m=json.loads((root/"manifest.json").read_text())
          with (root/"grid_summaries.csv").open(newline="") as f: rows=list(csv.DictReader(f))
          with (root/"grid_differences.csv").open(newline="") as f: diffs=list(csv.DictReader(f))
          assert len(rows)==27*30*3*4, len(rows)
          assert len(diffs)==len(rows), (len(diffs),len(rows))
          assert m["observations"]==810
          assert m["raw_posterior_summaries"]==len(rows)
          assert all(math.isfinite(float(r["median"])) for r in rows)
          print(json.dumps(m,indent=2))
          PY
      - name: Upload grid-resolution audit
        uses: actions/upload-artifact@v4
        with:
          name: joint-grid-resolution-audit
          path: results/grid-resolution-audit/
          if-no-files-found: error
          retention-days: 90
