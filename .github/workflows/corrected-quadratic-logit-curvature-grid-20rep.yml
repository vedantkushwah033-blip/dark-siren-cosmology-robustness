name: corrected-quadratic-logit-curvature-grid-20rep

on:
  push:
    branches:
      - research/corrected-curvature-grid-20rep-20261118
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corrected-quadratic-logit-curvature-grid-20rep
  cancel-in-progress: false

jobs:
  curvature-cells:
    name: corrected gamma ${{ matrix.gamma }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - gamma: -2.0
            key: m2
          - gamma: -1.0
            key: m1
          - gamma: -0.5
            key: m05
          - gamma: 0.0
            key: zero
          - gamma: 0.5
            key: p05
          - gamma: 1.0
            key: p1
          - gamma: 2.0
            key: p2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run corrected 20-replicate density cell
        run: |
          python scripts/run_absolute_bandwidth_density_replicates.py \
            --master-seed 2026111900 \
            --seed-stride 10 \
            --replicates 20 \
            --n-parent 4000 \
            --validation-frame 1500 \
            --validation-sizes 100,300,1000 \
            --gamma "${{ matrix.gamma }}" \
            --beta -3.9 \
            --scott-multiplier 0.7 \
            --quadrature-order 5 \
            --grid-points 401 \
            --absolute-widths 0.012,0.016,0.020,0.024,0.028,0.032,0.040 \
            --output-dir "artifacts/gamma_${{ matrix.key }}"
      - name: Independently audit all replicates and require complete cell
        run: |
          python scripts/audit_absolute_bandwidth_density_replicates.py \
            "artifacts/gamma_${{ matrix.key }}" \
            --output "artifacts/gamma_${{ matrix.key }}/outer_independent_audit.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/gamma_${{ matrix.key }}/outer_independent_audit.json")
          report = json.loads(p.read_text())
          print(json.dumps(report, indent=2, sort_keys=True))
          assert report.get("status") == "PASS", report
          assert report.get("planned_replicates") == 20, report
          assert report.get("successful_replicates") == 20, report
          assert report.get("failed_replicates") == 0, report
          assert report.get("child_raw_audits_passed") == 20, report
          PY
      - name: Preserve raw cell artifact even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-curvature-gamma-${{ matrix.key }}
          path: artifacts/gamma_${{ matrix.key }}
          if-no-files-found: warn
          retention-days: 30

  cross-gamma-audit:
    name: Cross-gamma paired audit and summaries
    runs-on: ubuntu-latest
    needs: curvature-cells
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download all seven corrected gamma artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: corrected-curvature-gamma-*
          path: artifacts
          merge-multiple: false
      - name: Verify complete paired design and reconstruct cross-gamma summaries
        run: |
          python scripts/audit_quadratic_logit_curvature_pilot.py \
            artifacts \
            --output-dir curvature_summary
      - name: Upload cross-gamma audit and paired summaries
        uses: actions/upload-artifact@v4
        with:
          name: corrected-quadratic-logit-curvature-cross-gamma-summary
          path: curvature_summary
          if-no-files-found: error
          retention-days: 30
