name: corrected-density-single-replicate-audit

on:
  push:
    branches:
      - research/corrected-density-smoke-validation-20261118

permissions:
  contents: read

concurrency:
  group: corrected-density-single-replicate-audit
  cancel-in-progress: false

jobs:
  corrected-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run corrected one-replicate density smoke
        run: |
          python scripts/run_absolute_bandwidth_density_smoke.py \
            --seed 2026111801 \
            --validation-seed 2026111802 \
            --n-parent 700 \
            --validation-frame 300 \
            --validation-sizes 80,160 \
            --gamma 0.5 \
            --beta -3.9 \
            --quadrature-order 3 \
            --grid-points 101 \
            --scott-multiplier 0.7 \
            --absolute-widths 0.012,0.024 \
            --output-dir artifacts/corrected_single_replicate
      - name: Independently audit raw smoke artifacts
        run: |
          python scripts/audit_absolute_bandwidth_density_smoke.py \
            artifacts/corrected_single_replicate \
            --output artifacts/corrected_single_replicate/independent_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/corrected_single_replicate/independent_audit.json")
          report = json.loads(p.read_text())
          print(json.dumps(report, indent=2, sort_keys=True))
          assert report.get("status") == "PASS", report
          PY
      - name: Upload raw inputs, outputs, manifests, and independent audit
        uses: actions/upload-artifact@v4
        with:
          name: corrected-density-single-replicate-${{ github.sha }}
          path: artifacts/corrected_single_replicate/
          if-no-files-found: error
          retention-days: 14
