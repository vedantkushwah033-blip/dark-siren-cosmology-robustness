name: known-host-calibration-surface

on:
  # Run the default calibration automatically when the experiment runner changes
  # on this working branch; manual dispatch remains available for larger runs.
  push:
    branches:
      - fix/known-host-wilson-edge-bounds
    paths:
      - scripts/run_known_host_calibration_surface.py
  workflow_dispatch:
    inputs:
      replicates:
        description: "Replicates per H0 truth and noise cell (minimum 100)"
        required: true
        default: "300"
        type: string
      seed:
        description: "Base random seed"
        required: true
        default: "20261025"
        type: string

permissions:
  contents: read

jobs:
  calibration-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out robustness repository
        uses: actions/checkout@v4
      - name: Check out pinned simulator revision
        uses: actions/checkout@v4
        with:
          repository: vedantkushwah033-blip/bayesian-dark-siren-cosmology
          ref: b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f
          path: original-project
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run known-host calibration surface
        env:
          REPLICATES: ${{ inputs.replicates || '300' }}
          BASE_SEED: ${{ inputs.seed || '20261025' }}
        run: |
          python scripts/run_known_host_calibration_surface.py \
            --original-dir original-project \
            --replicates "$REPLICATES" \
            --seed "$BASE_SEED" \
            --output-dir results/known-host-calibration-surface
      - name: Independently recompute summaries and audit pairing
        env:
          REPLICATES: ${{ inputs.replicates || '300' }}
        run: >-
          python scripts/audit_known_host_calibration_surface.py
          results/known-host-calibration-surface
          --replicates "$REPLICATES"
      - name: Analyze paired noise-level contrasts
        env:
          REPLICATES: ${{ inputs.replicates || '300' }}
          BASE_SEED: ${{ inputs.seed || '20261025' }}
        run: >-
          python scripts/analyze_known_host_paired_comparisons.py
          results/known-host-calibration-surface
          --replicates "$REPLICATES"
          --seed "$BASE_SEED"
          --bootstrap-resamples 4000
      - name: Independently audit paired comparison table and bootstrap intervals
        run: python scripts/audit_known_host_paired_comparisons.py results/known-host-calibration-surface
      - name: Render boundary-aware calibration report
        run: |
          python scripts/render_known_host_calibration_report.py results/known-host-calibration-surface
      - name: Upload raw results, summaries, and metadata
        uses: actions/upload-artifact@v4
        with:
          name: known-host-calibration-surface
          path: results/known-host-calibration-surface/
          if-no-files-found: error
