name: factorial-sensitivity

on:
  push:
    paths:
      - ".github/factorial-run-once.trigger"
  workflow_dispatch:
    inputs:
      replicates:
        description: "Independent mock universes per scenario (500 recommended; 1000 for stronger precision)"
        required: true
        default: "500"
        type: string
      seed:
        description: "Base random seed"
        required: true
        default: "2026"
        type: string

jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPLICATES: ${{ inputs.replicates || '500' }}
      BASE_SEED: ${{ inputs.seed || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test factorial contrast analysis
        run: |
          python -m pip install pytest numpy
          pytest -q tests/test_factorial_contrast_analysis.py tests/test_oracle_missing_host_analysis.py tests/test_oracle_summary_metrics.py tests/test_known_host_oracle.py tests/test_known_host_oracle_contrasts.py
      - name: Clone original project at audited commit
        run: |
          git clone https://github.com/vedantkushwah033-blip/bayesian-dark-siren-cosmology.git original-project
          cd original-project
          git checkout b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f
      - name: Install original project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r original-project/requirements.txt
      - name: Run host-weighting and incompleteness sensitivity matrix
        run: |
          python scripts/run_factorial_sensitivity.py \
            --original-dir original-project \
            --replicates "$REPLICATES" \
            --seed "$BASE_SEED"
      - name: Validate factorial output
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("results/factorial-sensitivity")
          required = [root / "scenario_summary.csv", root / "scenario_summary.json", root / "per_run_results.csv"]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty artifact: {path}")
          summary = json.loads((root / "scenario_summary.json").read_text())
          n = int(summary["requested_replicates_per_scenario"])
          if summary["scenario_count"] != 9 or len(summary["scenarios"]) != 9:
              raise SystemExit("Expected nine scenarios")
          with (root / "scenario_summary.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) != 9 or any(int(r["n"]) != n for r in rows):
              raise SystemExit("Scenario summary row counts do not match requested replicates")
          with (root / "per_run_results.csv").open(newline="") as f:
              run_rows = list(csv.DictReader(f))
          if len(run_rows) != 9 * n:
              raise SystemExit(f"Expected {9*n} per-run rows, got {len(run_rows)}")
          expected_scenarios = {row["scenario"] for row in rows}
          if {row["scenario"] for row in run_rows} != expected_scenarios:
              raise SystemExit("Per-run scenario labels do not match summary scenarios")
          for row in run_rows:
              realized = float(row["realized_completeness"])
              target = float(row["target_completeness"])
              if target == 0.7 and abs(realized - 0.7) > 1e-12:
                  raise SystemExit(f"Expected exact 70% completeness, got {realized} in {row['scenario']}")
              for key in ("median", "lower_68", "upper_68", "lower_95", "upper_95", "width_68", "width_95"):
                  value = float(row[key])
                  if not __import__("math").isfinite(value):
                      raise SystemExit(f"Non-finite {key} in {row['scenario']}: {value}")
              if float(row["lower_68"]) > float(row["upper_68"]) or float(row["lower_95"]) > float(row["upper_95"]):
                  raise SystemExit(f"Invalid interval bounds in {row['scenario']}")
          print(f"Validated nine scenarios, exact 70% masks, and {len(run_rows)} finite per-run records.")
          PY
      - name: Independently audit factorial outputs
        run: python scripts/audit_factorial_sensitivity_outputs.py results/factorial-sensitivity
      - name: Analyze prespecified scenario contrasts
        run: |
          python scripts/analyze_factorial_contrasts.py \
            --input results/factorial-sensitivity/per_run_results.csv \
            --output results/factorial-sensitivity/contrast_analysis.json \
            --bootstrap 5000 \
            --seed 20261023
      - name: Build synthetic experiment report
        run: |
          python scripts/build_experiment_report.py \
            --results-root results \
            --output results/factorial-sensitivity/experiment_report.md
      - name: Run missing-host oracle control experiment
        run: |
          python scripts/run_oracle_missing_host_control.py \
            --original-dir original-project \
            --replicates "$REPLICATES" \
            --seed "$BASE_SEED"
      - name: Validate oracle-control output
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("results/oracle-missing-host")
          required = [root / "scenario_summary.csv", root / "scenario_summary.json", root / "per_run_results.csv"]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty artifact: {path}")
          summary = json.loads((root / "scenario_summary.json").read_text())
          n = int(summary["requested_replicates_per_scenario"])
          if summary["scenario_count"] != 6 or len(summary["scenarios"]) != 6:
              raise SystemExit("Expected six oracle-control scenarios")
          with (root / "scenario_summary.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) != 6 or any(int(r["n"]) != n for r in rows):
              raise SystemExit("Oracle-control summary counts do not match requested replicates")
          with (root / "per_run_results.csv").open(newline="") as f:
              runs = list(csv.DictReader(f))
          if len(runs) != 6 * n:
              raise SystemExit(f"Expected {6*n} oracle-control rows, got {len(runs)}")
          print(f"Validated six oracle-control scenarios and {len(runs)} per-run rows.")
          PY
      - name: Analyze missing-host control contrasts
        run: |
          python scripts/analyze_oracle_missing_host.py \
            --input results/oracle-missing-host/per_run_results.csv \
            --output results/oracle-missing-host/contrast_analysis.json \
            --bootstrap 5000 \
            --seed 20261024
      - name: Run full-population oracle benchmark
        run: |
          python scripts/run_full_population_oracle.py \
            --original-dir original-project \
            --replicates "$REPLICATES" \
            --seed "$BASE_SEED"
      - name: Validate full-population oracle output
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results/full-population-oracle")
          required = [root / "scenario_summary.csv", root / "scenario_summary.json", root / "per_run_results.csv"]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty artifact: {path}")
          summary = json.loads((root / "scenario_summary.json").read_text())
          n = int(summary["requested_replicates_per_scenario"])
          if summary["scenario_count"] != 2 or len(summary["scenarios"]) != 2:
              raise SystemExit("Expected two full-population oracle scenarios")
          with (root / "scenario_summary.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) != 2 or any(int(row["n"]) != n for row in rows):
              raise SystemExit("Full-population oracle summary counts do not match requested replicates")
          with (root / "per_run_results.csv").open(newline="") as f:
              runs = list(csv.DictReader(f))
          if len(runs) != 2 * n:
              raise SystemExit(f"Expected {2*n} per-run rows, got {len(runs)}")
          by_scenario = {}
          for row in runs:
              by_scenario.setdefault(row["scenario"], {})[int(row["run"])] = row
              for key in ("median", "mean", "lower_68", "upper_68", "lower_95", "upper_95"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite {key} in {row['scenario']}")
          left = by_scenario["random70_full_population_oracle"]
          right = by_scenario["redshift70_full_population_oracle"]
          if set(left) != set(right):
              raise SystemExit("Paired oracle scenarios have different run indices")
          paired_keys = ("seed", "host_redshift", "observed_distance_mpc", "distance_sigma_mpc",
                         "median", "mean", "posterior_sd", "lower_68", "upper_68", "lower_95", "upper_95")
          for index in left:
              for key in paired_keys:
                  if float(left[index][key]) != float(right[index][key]):
                      raise SystemExit(f"Oracle event/posterior differs across masks at run {index}, field {key}")
          print(f"Validated two paired oracle scenarios, identical full-population posteriors, and {len(runs)} finite per-run records.")
          PY
      - name: Run known-host oracle calibration control
        run: |
          python scripts/run_known_host_oracle.py \
            --original-dir original-project \
            --replicates "$REPLICATES" \
            --seed "$BASE_SEED"
      - name: Validate known-host oracle output
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results/known-host-oracle")
          required = [root / "scenario_summary.csv", root / "scenario_summary.json", root / "per_run_results.csv"]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty artifact: {path}")
          metadata = json.loads((root / "scenario_summary.json").read_text())
          n = int(metadata["requested_replicates_per_scenario"])
          if metadata.get("original_commit") != "b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f":
              raise SystemExit("Known-host oracle source commit is not pinned as expected")
          if metadata.get("true_h0") != 70.0 or metadata.get("scenario_count") != 1:
              raise SystemExit("Known-host oracle metadata does not match the protocol")
          with (root / "scenario_summary.csv").open(newline="") as f:
              summaries = list(csv.DictReader(f))
          with (root / "per_run_results.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          if len(summaries) != 1 or int(summaries[0]["n"]) != n or len(rows) != n:
              raise SystemExit("Known-host oracle replicate counts are inconsistent")
          if len({int(row["run"]) for row in rows}) != n:
              raise SystemExit("Known-host oracle run indices are not unique")
          for row in rows:
              for key in ("median", "mean", "posterior_sd", "lower_68", "upper_68", "lower_95", "upper_95"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite {key} in known-host oracle output")
              if float(row["lower_68"]) > float(row["upper_68"]) or float(row["lower_95"]) > float(row["upper_95"]):
                  raise SystemExit("Known-host oracle has reversed interval bounds")
              if float(row["lower_95"]) > float(row["lower_68"]) or float(row["upper_68"]) > float(row["upper_95"]):
                  raise SystemExit("Known-host oracle 68% interval is not nested in 95% interval")
          print(f"Validated {n} known-host oracle calibration records.")
          PY
      - name: Analyze paired known-host calibration contrasts
        run: |
          python scripts/analyze_known_host_oracle_contrasts.py \
            --full-population-input results/full-population-oracle/per_run_results.csv \
            --known-host-input results/known-host-oracle/per_run_results.csv \
            --output results/known-host-oracle/paired_contrasts.json \
            --bootstrap 50000 \
            --seed 20261025
      - name: Upload factorial results
        uses: actions/upload-artifact@v4
        with:
          name: factorial-sensitivity
          path: |
            results/factorial-sensitivity/
            results/oracle-missing-host/
            results/full-population-oracle/
            results/known-host-oracle/
          if-no-files-found: error
