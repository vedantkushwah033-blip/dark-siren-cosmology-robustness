name: fixed-analysis-catalogue-density-confirmatory
on:
  push:
    branches:
      - research/independent-posterior-audit-claim-fix
    paths:
      - .github/workflows/fixed-analysis-catalogue-density-confirmatory.yml
      - src/dark_siren_robustness/fixed_analysis_catalogue_benchmark.py
      - src/dark_siren_robustness/fixed_analysis_catalogue_audit.py
      - src/dark_siren_robustness/fixed_analysis_catalogue_analysis.py
      - src/dark_siren_robustness/finite_validation_density_recovery.py
      - src/dark_siren_robustness/catalogue_density.py
      - scripts/run_fixed_analysis_catalogue_benchmark.py
      - scripts/audit_fixed_analysis_catalogue_benchmark.py
      - scripts/analyze_fixed_analysis_catalogue_confirmatory.py
      - tests/test_fixed_analysis_catalogue_benchmark.py
      - tests/test_fixed_analysis_catalogue_analysis.py
      - docs/fixed_analysis_catalogue_confirmatory_analysis_plan_2026-11-08.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-analysis-catalogue-density-confirmatory
  cancel-in-progress: false
jobs:
  fixed-catalogue-confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run FAC benchmark, auditor and analysis tests
        run: |
          python -m pytest \
            tests/test_fixed_analysis_catalogue_benchmark.py \
            tests/test_fixed_analysis_catalogue_analysis.py -q
      - name: Run predeclared 100-replicate fixed-analysis-catalogue design
        run: |
          python scripts/run_fixed_analysis_catalogue_benchmark.py \
            --replicates 100 --n-analysis 4000 --n-validation-max 1000 \
            --seed 20261110 --grid-points 801 \
            --output-dir artifacts/fixed_analysis_catalogue_density_confirmatory
      - name: Independently audit the complete raw artifact
        run: |
          python scripts/audit_fixed_analysis_catalogue_benchmark.py \
            --artifact-dir artifacts/fixed_analysis_catalogue_density_confirmatory \
            --output artifacts/fixed_analysis_catalogue_density_confirmatory/audit_report.json
      - name: Calculate predeclared primary interaction and Holm-adjusted secondary contrasts
        run: |
          python scripts/analyze_fixed_analysis_catalogue_confirmatory.py \
            --attempts-csv artifacts/fixed_analysis_catalogue_density_confirmatory/attempt_metrics.csv \
            --planned-replicates 100 \
            --output artifacts/fixed_analysis_catalogue_density_confirmatory/confirmatory_analysis.json
      - name: Upload audited confirmatory artifact and analysis
        uses: actions/upload-artifact@v4
        with:
          name: fixed-analysis-catalogue-density-confirmatory-py3.12
          path: artifacts/fixed_analysis_catalogue_density_confirmatory/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
