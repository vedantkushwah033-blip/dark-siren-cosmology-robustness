name: inclusion-posterior-mode-refinement

on:
  push:
    branches:
      - research/inclusion-posterior-mode-refinement-20261114
    paths:
      - .github/workflows/inclusion-posterior-mode-refinement.yml
      - src/dark_siren_robustness/inclusion_posterior.py
      - tests/test_inclusion_posterior.py
  workflow_dispatch:

concurrency:
  group: inclusion-posterior-mode-refinement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  posterior-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run inclusion-posterior numerical and calibration tests
        run: |
          python -m pytest \
            tests/test_inclusion_posterior.py \
            tests/test_inclusion_posterior_calibration.py \
            tests/test_inclusion_posterior_grid_reference.py -q
