name: Coverage transition map
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_coverage_transition_map.py"
      - "scripts/run_prior_support_sensitivity.py"
      - "scripts/run_fixed_truth_coverage_map.py"
      - "tests/test_coverage_transition_map.py"
      - ".github/workflows/coverage-transition-map.yml"
      - "src/dark_siren_robustness/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transition-map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run transition map
        run: python scripts/run_coverage_transition_map.py --replicates 300 --seed 20261025 --grid-size 4001 --output-dir results/coverage-transition
      - name: Run focused tests
        run: python -m pytest tests/test_coverage_transition_map.py -q
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-transition-python-${{ matrix.python-version }}
          path: |
            results/coverage-transition/per_run.csv
            results/coverage-transition/summary.csv\n            results/coverage-transition/paired_method_contrasts.csv
          if-no-files-found: error
          retention-days: 90
