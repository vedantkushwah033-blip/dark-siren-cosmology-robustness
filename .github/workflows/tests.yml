name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Serialize duplicate push/pull_request validations on a branch without killing
# an active full matrix run. GitHub may emit both events for the same PR update.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  numerical-diagnostics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test explicit distance-uncertainty likelihood models
        run: python -m pytest tests/test_uncertainty_likelihoods.py -q
      - name: Test isolated dataset-level likelihood composition
        run: python -m pytest tests/test_dataset_likelihood.py -q
      - name: Test H0-dependent noise and selection-conditioned dataset inference
        run: python -m pytest tests/test_selection_conditioned_h0_dependent_noise.py -q
      - name: Test independent H0-dependent-noise SBC artifact auditor
        run: python -m pytest tests/test_audit_h0_dependent_noise_sbc.py -q
      - name: Test reproducible paired analysis of selection-misspecification artifacts
        run: python -m pytest tests/test_analyze_selection_misspecification_pairs.py -q
      - name: Test empirical toy detection-efficiency calibration
        run: python -m pytest tests/test_detection_efficiency_empirical.py -q
      - name: Test low-redshift selection-aware toy likelihood
        run: python -m pytest tests/test_selection_toy.py -q
      - name: Test catalogue completeness and Bernoulli thinning
        run: python -m pytest tests/test_completeness.py -q
      - name: Test independent catalogue-thinning artifact audit
        run: python -m pytest tests/test_catalogue_thinning_audit.py -q
      - name: Test separated catalogue and GW selection generator
        run: python -m pytest tests/test_generative_selection.py -q
      - name: Run separated-selection generator smoke experiment
        run: python scripts/run_synthetic_selection_experiment.py --seed 20261028 --n-parent 1200 --n-detected 25 --output-dir artifacts/synthetic_selection_smoke
      - name: Test bounded KDE host-density estimation and selection-weight correction
        run: python -m pytest tests/test_catalogue_density.py -q
      - name: Test estimated catalogue inclusion from external validation data
        run: python -m pytest tests/test_estimated_inclusion.py -q
      - name: Test estimated-inclusion pilot runner
        run: python -m pytest tests/test_estimated_inclusion_study.py -q
      - name: Test independent estimated-inclusion artifact auditor
        run: python -m pytest tests/test_audit_estimated_inclusion_pilot.py -q
      - name: Test paired nonlinear inclusion-curvature screen and independent audits
        run: python -m pytest tests/test_estimated_inclusion_curvature_screen.py -q
      - name: Run non-confirmatory estimated-inclusion pilot smoke experiment
        run: python scripts/run_estimated_inclusion_pilot.py --replicates 2 --n-parent 1200 --n-detected 8 --validation-sizes 100,300 --seed 20261030 --h0-points 41 --z-points 201 --output-dir artifacts/estimated_inclusion_pilot_smoke
      - name: Check estimated-inclusion pilot smoke outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/estimated_inclusion_pilot_smoke')
          summary = json.loads((p / 'summary.json').read_text())
          assert summary['status'] == 'NON_CONFIRMATORY_SYNTHETIC_PILOT'
          assert (p / 'replicates.csv').stat().st_size > 0
          print("Validated {} arm summaries.".format(len(summary['arm_summaries'])))
          PY
      - name: Independently audit estimated-inclusion pilot smoke artifacts
        run: python scripts/audit_estimated_inclusion_pilot.py artifacts/estimated_inclusion_pilot_smoke
      - name: Test persisted validation-bootstrap artifact generation and independent refit audit
        run: python -m pytest tests/test_validation_bootstrap_artifacts.py -q
      - name: Run and independently audit persisted validation-bootstrap sensitivity (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import pandas as pd
          frame = pd.read_csv('artifacts/estimated_inclusion_pilot_smoke/replicates.csv')
          rows = frame.loc[
              frame['arm'].str.startswith('estimated_') & frame['status'].eq('success')
          ].sort_values(['replicate', 'validation_size'])
          if rows.empty:
              raise SystemExit('No successful estimated-inclusion arm available for bootstrap smoke audit')
          row = rows.iloc[0]
          print(f"Selected replicate={int(row['replicate'])}, validation_size={int(row['validation_size'])}")
          with open('artifacts/bootstrap_selection.txt', 'w') as handle:
              handle.write(f"{int(row['replicate'])},{int(row['validation_size'])}\n")
          PY
          read REPLICATE VALIDATION_SIZE < <(tr ',' ' ' < artifacts/bootstrap_selection.txt)
          python scripts/run_validation_bootstrap_sensitivity.py --pilot-csv artifacts/estimated_inclusion_pilot_smoke/replicates.csv --replicate "$REPLICATE" --validation-size "$VALIDATION_SIZE" --n-bootstrap 100 --seed 20261031 --output-dir artifacts/validation_bootstrap_smoke
          python scripts/audit_validation_bootstrap_sensitivity.py --artifact-dir artifacts/validation_bootstrap_smoke --pilot-csv artifacts/estimated_inclusion_pilot_smoke/replicates.csv
      - name: Test finite-parent SRSWOR validation benchmark
        run: python -m pytest tests/test_finite_parent_sampling.py -q
      - name: Test finite-parent bootstrap uncertainty primitives
        run: python -m pytest tests/test_finite_parent_uncertainty.py -q
      - name: Test design-aware pseudo-population SRSWOR bootstrap indices
        run: python -m pytest tests/test_design_aware_srswor_bootstrap.py -q
      - name: Test design-aware validation bootstrap and pseudo-population references
        run: python -m pytest tests/test_design_aware_validation_bootstrap.py -q
      - name: Test posterior-level validation bootstrap through H0 inference
        run: python -m pytest tests/test_posterior_validation_bootstrap.py -q
      - name: Test scenario-balanced bootstrap calibration estimands
        run: python -m pytest tests/test_bootstrap_calibration.py -q
      - name: Test independent nested validation-bootstrap artifact auditor and tamper detection
        run: python -m pytest tests/test_audit_nested_validation_bootstrap_artifacts.py -q
      - name: Run integrated nested validation-bootstrap comparison smoke experiment
        run: python scripts/run_nested_validation_bootstrap_comparison.py --scenarios 1 --draws 2 --n-parent 1200 --n-detected 8 --validation-sizes 100 --bootstrap-replicates 3 --seed 20261030 --output-dir artifacts/nested_validation_bootstrap_smoke
      - name: Check integrated nested comparison smoke artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p = Path('artifacts/nested_validation_bootstrap_smoke')
          manifest = json.loads((p / 'manifest.json').read_text())
          assert manifest['status'] == 'SMOKE_ONLY_NOT_CONFIRMATORY'
          records = pd.read_csv(p / 'calibration_records.csv')
          attempts = pd.read_json(p / 'attempt_audit.jsonl', lines=True)
          scenario = pd.read_csv(p / 'scenario_summary.csv')
          aggregate = pd.read_csv(p / 'scenario_balanced_summary.csv')
          assert len(records) == 6
          assert set(records['method']) == {'paired_bootstrap', 'paired_bootstrap_fpc', 'design_aware_srswor'}
          assert len(attempts) == 6
          assert not scenario.empty and not aggregate.empty
          assert records.groupby(['scenario', 'validation_size', 'outer_draw'])['finite_parent_target'].nunique().max() == 1
          print('Validated integrated smoke rows:', len(records))
          PY
      - name: Independently audit nested validation-bootstrap smoke artifacts
        run: python scripts/audit_nested_validation_bootstrap_artifacts.py artifacts/nested_validation_bootstrap_smoke
      - name: Independently replay nested bootstrap scenario and posterior artifacts
        run: python scripts/audit_nested_validation_bootstrap_replay.py artifacts/nested_validation_bootstrap_smoke
      - name: Run finite-parent validation-sampling smoke benchmark
        run: python scripts/run_finite_parent_validation_benchmark.py --scenarios 2 --draws 3 --n-parent 1200 --n-detected 8 --validation-sizes 100,300 --seed 20261032 --output-dir artifacts/finite_parent_validation_smoke
      - name: Check finite-parent smoke artifact accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/finite_parent_validation_smoke')
          s = json.loads((p / 'summary.json').read_text())
          assert s['status'] == 'SMOKE_ONLY_NOT_CONFIRMATORY'
          assert s['n_attempted'] == s['n_successful'] + s['n_failed']
          assert (p / 'records.csv').stat().st_size > 0
          print('Validated finite-parent smoke accounting:', s['n_attempted'])
          PY
      - name: Test independent finite-parent SRSWOR artifact audit
        run: python -m pytest tests/test_audit_finite_parent_validation_benchmark.py -q
      - name: Independently audit finite-parent validation smoke artifacts
        run: python scripts/audit_finite_parent_validation_benchmark.py artifacts/finite_parent_validation_smoke
      - name: Test host-density-to-H0 benchmark
        run: python -m pytest tests/test_host_density_benchmark.py -q
      - name: Test corrected physical KDE bandwidth semantics
        run: python -m pytest tests/test_kde_bandwidth_definition.py -q
      - name: Test independent host-density re-simulation audit
        run: python -m pytest tests/test_audit_host_density_independent.py -q
      - name: Test full host-density campaign auditor primitives
        run: python -m pytest tests/test_audit_host_density_campaign.py -q
      - name: Test prior-averaged oracle calibration and negative control
        run: python -m pytest tests/test_oracle_prior_averaged_calibration.py -q
      - name: Test independent exact-density oracle data and posterior audit
        run: python -m pytest tests/test_audit_oracle_bias.py -q
      - name: Run small host-density-to-H0 benchmark smoke experiment
        run: python scripts/run_host_density_benchmark.py --replicates 1 --n-parent 1200 --n-detected 8 --h0-points 51 --z-points 201 --output-dir artifacts/host_density_benchmark_smoke
      - name: Check host-density smoke manifest and checksums
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('artifacts/host_density_benchmark_smoke')
          m = json.loads((p/'manifest.json').read_text())
          assert all(hashlib.sha256((p/name).read_bytes()).hexdigest() == row['sha256']
                     for name, row in m['files'].items())
          print(f"Verified {len(m['files'])} manifest entries.")
          PY
      - name: Test independent host-density benchmark artifact audit
        run: python -m pytest tests/test_audit_host_density_benchmark.py -q
      - name: Independently audit host-density benchmark smoke artifacts
        run: python scripts/audit_host_density_benchmark.py artifacts/host_density_benchmark_smoke
      - name: Test selection-function misspecification experiment
        run: python -m pytest tests/test_selection_misspecification.py -q
      - name: Run paired selection-function misspecification smoke experiment
        run: python scripts/run_selection_misspecification.py --replicates 2 --n-parent 1200 --n-detected 8 --seed 55129 --h0-points 51 --z-points 201 --output-dir artifacts/selection_misspecification_smoke
      - name: Test independent selection-misspecification artifact audit
        run: python -m pytest tests/test_audit_selection_misspecification.py -q
      - name: Independently audit selection-misspecification smoke artifacts
        run: python scripts/audit_selection_misspecification.py artifacts/selection_misspecification_smoke
      - name: Test paired distance-uncertainty sensitivity experiment
        run: python -m pytest tests/test_uncertainty_sensitivity.py -q
      - name: Run paired distance-uncertainty sensitivity smoke experiment
        run: python scripts/run_distance_uncertainty_sensitivity.py --replicates 2 --seed 20261026 --output-dir artifacts/distance_uncertainty_sensitivity
      - name: Test independent distance-uncertainty artifact audit
        run: python -m pytest tests/test_audit_distance_uncertainty_sensitivity.py -q
      - name: Independently reconstruct distance-uncertainty raw records and summaries
        run: python scripts/audit_distance_uncertainty_sensitivity.py artifacts/distance_uncertainty_sensitivity
      - name: Test overflow-safe host-weight normalization across inference models
        run: python -m pytest tests/test_cosmological_inference_weight_normalization.py -q
      - name: Test joint selection and missing-host compatibility limits
        run: python -m pytest tests/test_joint_selection_missing_hosts.py -q
      - name: Test selected-likelihood calibration runner determinism and summary invariants
        run: python -m pytest tests/test_selected_likelihood_sbc.py -q
      - name: Run reproducible selected-likelihood PIT calibration
        run: python scripts/run_selected_likelihood_sbc.py --replicates 1000 --output-dir artifacts/selected_likelihood_sbc
      - name: Independently audit raw PIT records and summary
        run: python scripts/audit_selected_likelihood_sbc.py
      - name: Compare selected-likelihood PIT calibration across grid resolutions
        run: python scripts/run_calibration_grid_sensitivity.py --replicates 300 --seed 20261025 --grid-points 1201,2401,4801 --output-dir artifacts/calibration_grid_sensitivity
      - name: Independently audit paired grid-sensitivity comparison and summary statistics
        run: python scripts/audit_calibration_grid_sensitivity.py artifacts/calibration_grid_sensitivity
      - name: Test calibration grid-sensitivity experiment
        run: python -m pytest tests/test_calibration_grid_sensitivity.py tests/test_audit_calibration_grid_sensitivity.py -q
      - name: Test multi-seed paired grid-sensitivity aggregation and independent audit
        run: python -m pytest tests/test_multiseed_grid_sensitivity.py tests/test_audit_multiseed_grid_sensitivity.py -q
      - name: Run independently audited multi-seed grid-sensitivity smoke experiment
        run: python scripts/run_multiseed_grid_sensitivity.py --replicates 100 --seeds 101,202 --grid-points 1201,2401 --output-dir artifacts/multiseed_grid_sensitivity
      - name: Independently audit multi-seed aggregate artifacts
        run: python scripts/audit_multiseed_grid_sensitivity.py artifacts/multiseed_grid_sensitivity
      - name: Test independent paired host-weight contrast reconstruction
        run: python -m pytest tests/test_paired_host_weight_contrasts.py -q
      - name: Test host-misspecification stress test and independent reconstruction audit
        run: python -m pytest tests/test_host_misspecification_audit.py -q
      - name: Test equal-cell host sensitivity summary and paired bootstrap
        run: python -m pytest tests/test_summarize_host_misspecification_sensitivity_surface.py -q
      - name: Test prior-support × hidden-host factorial and independent audit
        run: python -m pytest tests/test_host_prior_support_factorial.py -q
      - name: Test equal-cell prior-support marginal summaries
        run: python -m pytest tests/test_summarize_host_prior_support_factorial.py -q
      - name: Test hidden-host fraction/redshift assumption sensitivity
        run: python -m pytest tests/test_hidden_host_assumption_sensitivity.py -q
      - name: Test marginal hidden-host assumption summaries
        run: python -m pytest tests/test_summarize_hidden_host_assumption_sensitivity.py -q
      - name: Test checksum-verified CHIMERA benchmark-data preparation
        run: python -m pytest tests/test_prepare_chimera_v2_benchmark_data.py -q
      - name: Run focused grid-convergence regression tests
        run: python -m pytest tests/test_targeted_grid_convergence.py tests/test_grid_refinement_audit.py -q
      - name: Test extreme posterior-grid resolution audit
        run: python -m pytest tests/test_extreme_grid_resolution_audit.py -q
      - name: Test fixed-truth coverage reference-interval audit
        run: python -m pytest tests/test_audit_fixed_truth_coverage_reference_interval.py -q
      - name: Run deterministic extreme posterior-grid resolution audit
        run: python scripts/audit_extreme_grid_resolution.py --output artifacts/extreme_grid_resolution_audit.json
      - name: Test independent distance-uncertainty grid-stability reconstruction
        run: python -m pytest tests/test_check_distance_uncertainty_grid_stability.py -q
      - name: Run posterior-grid stability diagnostic
        run: python scripts/run_posterior_grid_stability.py --output artifacts/posterior_grid_stability.csv
      - name: Run targeted upper-tail convergence diagnostic
        run: python scripts/run_targeted_grid_convergence.py --output artifacts/targeted_grid_convergence.csv
      - name: Run full 300-replicate distance-uncertainty sensitivity experiment (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/run_distance_uncertainty_sensitivity.py --replicates 300 --seed 20261026 --grid-points 1601 --bootstrap-resamples 2000 --output-dir artifacts/distance_uncertainty_sensitivity_full
      - name: Independently audit full distance-uncertainty experiment (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/audit_distance_uncertainty_sensitivity.py artifacts/distance_uncertainty_sensitivity_full
      - name: Compare fixed-truth Bayesian coverage with inverted Gaussian reference intervals (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/audit_fixed_truth_coverage_reference_interval.py artifacts/distance_uncertainty_sensitivity_full/replicates.csv --output artifacts/fixed_truth_coverage_reference_interval_audit.json
      - name: Summarize paired likelihood contrasts with stratified bootstrap (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/summarize_distance_uncertainty_paired_contrasts.py artifacts/distance_uncertainty_sensitivity_full/replicates.csv --seed 4182026 --bootstrap-resamples 10000
      - name: Independently recompute full-run posteriors on a finer grid (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/check_distance_uncertainty_grid_stability.py artifacts/distance_uncertainty_sensitivity_full/replicates.csv --fine-grid-points 3201 --max-allowed-change 0.001
      - name: Run and independently audit catalogue-thinning calibration (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_catalogue_thinning_audit.py --n-parent 40000 --seed 20261028 --output-dir artifacts/catalogue_thinning
          python scripts/audit_catalogue_thinning_audit.py artifacts/catalogue_thinning
      - name: Test independent-frame precision planning utility
        run: python -m pytest tests/test_frame_precision_planning.py -q
      - name: Test studentized finite-population mean bootstrap primitive
        run: python -m pytest tests/test_finite_population_mean_bootstrap.py -q
      - name: Test linear finite-population benchmark and independent auditor
        run: python -m pytest tests/test_linear_finite_population_bootstrap_benchmark.py -q
      - name: Run linear finite-population bootstrap pilot (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_linear_finite_population_bootstrap_benchmark.py --scenarios 3 --repetitions 100 --population-size 1000 --sample-sizes 100 400 --bootstrap-replicates 199 --seed 20261031 --output-dir artifacts/linear_finite_population_bootstrap_pilot
      - name: Independently audit linear finite-population bootstrap pilot (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/audit_linear_finite_population_bootstrap_benchmark.py --output-dir artifacts/linear_finite_population_bootstrap_pilot --report artifacts/linear_finite_population_bootstrap_pilot/audit_report.json
      - name: Test v3 multi-frame pilot runner and independent auditor
        run: python -m pytest tests/test_multiframe_v3_runner.py tests/test_multiframe_v3_auditor.py -q
      - name: Generate and independently audit v3 multi-frame smoke artifact (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_multiframe_v3_pilot.py --manifest configs/multiframe_v3_smoke_manifest.json --output-dir artifacts/multiframe_v3_smoke
          python scripts/audit_multiframe_v3_pilot.py --output-dir artifacts/multiframe_v3_smoke --report artifacts/multiframe_v3_smoke/audit_report.json
      - name: Upload numerical diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: numerical-diagnostics-py${{ matrix.python-version }}
          path: |
            artifacts/posterior_grid_stability.csv
            artifacts/targeted_grid_convergence.csv
            artifacts/extreme_grid_resolution_audit.json
            artifacts/fixed_truth_coverage_reference_interval_audit.json
            artifacts/distance_uncertainty_sensitivity/
            artifacts/distance_uncertainty_sensitivity_full/
            artifacts/selected_likelihood_sbc/pit_replicates.csv
            artifacts/selected_likelihood_sbc/pit_summary.json
            artifacts/selected_likelihood_sbc/audit_report.json
            artifacts/calibration_grid_sensitivity/
            artifacts/multiseed_grid_sensitivity/
            artifacts/catalogue_thinning/
            artifacts/estimated_inclusion_pilot_smoke/
            artifacts/validation_bootstrap_smoke/
            artifacts/bootstrap_selection.txt
            artifacts/nested_validation_bootstrap_smoke/
            artifacts/linear_finite_population_bootstrap_pilot/
            artifacts/multiframe_v3_smoke/
          if-no-files-found: error

