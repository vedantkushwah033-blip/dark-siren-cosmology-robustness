name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run posterior-grid stability diagnostic
        run: python scripts/run_posterior_grid_stability.py --output artifacts/posterior_grid_stability.csv
      - name: Upload posterior-grid stability results
        uses: actions/upload-artifact@v4
        with:
          name: posterior-grid-stability
          path: artifacts/posterior_grid_stability.csv
          if-no-files-found: error
