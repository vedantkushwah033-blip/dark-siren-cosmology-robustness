name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Serialize duplicate push/pull_request validations on a branch without killing
# an active full matrix run. GitHub may emit both events for the same PR update.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  numerical-diagnostics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test explicit distance-uncertainty likelihood models
        run: python -m pytest tests/test_uncertainty_likelihoods.py -q
      - name: Test isolated dataset-level likelihood composition
        run: python -m pytest tests/test_dataset_likelihood.py -q
      - name: Test empirical toy detection-efficiency calibration
        run: python -m pytest tests/test_detection_efficiency_empirical.py -q
      - name: Test low-redshift selection-aware toy likelihood
        run: python -m pytest tests/test_selection_toy.py -q
      - name: Test catalogue completeness and Bernoulli thinning
        run: python -m pytest tests/test_completeness.py -q
      - name: Test independent catalogue-thinning artifact audit
        run: python -m pytest tests/test_catalogue_thinning_audit.py -q
      - name: Test separated catalogue and GW selection generator
        run: python -m pytest tests/test_generative_selection.py -q
      - name: Run separated-selection generator smoke experiment
        run: python scripts/run_synthetic_selection_experiment.py --seed 20261028 --n-parent 1200 --n-detected 25 --output-dir artifacts/synthetic_selection_smoke
      - name: Test bounded KDE host-density estimation and selection-weight correction
        run: python -m pytest tests/test_catalogue_density.py -q
      - name: Test finite-validation inclusion fitting, disjoint sampling and IPW diagnostics
        run: python -m pytest tests/test_estimated_inclusion.py tests/test_validation_design.py tests/test_inclusion_diagnostics.py tests/test_estimated_inclusion_benchmark.py -q
      - name: Test proper inclusion-coefficient posterior quadrature
        run: python -m pytest tests/test_inclusion_posterior.py -q
      - name: Compare inclusion posterior quadrature with direct 2D integration
        run: python -m pytest tests/test_inclusion_posterior_grid_reference.py -q
      - name: Test matched five-arm inclusion-weight construction
        run: python -m pytest tests/test_five_arm_comparison.py -q
      - name: Test matched five-arm selected H0 likelihood
        run: python -m pytest tests/test_five_arm_likelihood.py -q
      - name: Test matched five-arm reflected-KDE selected H0 likelihood
        run: python -m pytest tests/test_five_arm_kde_likelihood.py -q
      - name: Test realized reflected-KDE bandwidth reporting
        run: python -m pytest tests/test_reflected_bandwidth_report.py -q
      - name: Test inclusion coefficient quadrature convergence through H0 posterior
        run: python -m pytest tests/test_five_arm_kde_quadrature_convergence.py -q
      - name: Test downstream five-arm KDE H0-grid convergence
        run: python -m pytest tests/test_five_arm_kde_grid_convergence.py -q
      - name: Run matched five-arm single-replicate smoke
        run: python scripts/run_five_arm_smoke.py --seed 20261113 --validation-seed 20261114 --n-parent 1200 --n-detected 4 --validation-frame 1500 --validation-sizes 100,300,1000 --h0-points 41 --quadrature-order 5 --output-dir artifacts/five_arm_smoke
      - name: Independently audit matched five-arm smoke artifacts
        run: python scripts/audit_five_arm_smoke.py artifacts/five_arm_smoke --output artifacts/five_arm_smoke_audit.json
      - name: Test raw artifact preservation for failed five-arm replicates
        run: python -m pytest tests/test_five_arm_smoke_failure_artifacts.py -q
      - name: Test multi-replicate five-arm aggregation and failure bounds
        run: python -m pytest tests/test_five_arm_replicate_aggregation.py -q
      - name: Validate multi-replicate five-arm pilot command-line interfaces
        run: |
          python scripts/run_five_arm_replicates.py --help
          python scripts/audit_five_arm_replicates.py --help
      - name: Run two-replicate matched five-arm orchestration smoke (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_five_arm_replicates.py \
            --master-seed 20261115 --replicates 2 \
            --n-parent 800 --n-detected 3 --validation-frame 250 \
            --validation-sizes 80,160 --h0-points 31 \
            --quadrature-order 3 --output-dir artifacts/five_arm_replicates_smoke
      - name: Independently audit multi-replicate five-arm orchestration (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/audit_five_arm_replicates.py artifacts/five_arm_replicates_smoke \
            --output artifacts/five_arm_replicates_smoke/independent_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/five_arm_replicates_smoke/independent_audit.json").read_text())
          assert report["status"] == "PASS"
          assert report["planned_replicates"] == 2
          assert report["successful_replicates"] == 2
          assert report["planned_lifecycle_cells"] == 20
          assert report["posterior_summary_rows"] == 20
          assert report["aggregate_metric_rows_reconstructed"] == 10
          assert report["paired_contrast_rows_reconstructed"] == 32
          PY
      - name: Test shared inclusion-selected likelihood and independent reconstruction
        run: python -m pytest tests/test_shared_inclusion_likelihood.py -q
      - name: Test end-to-end disjoint-validation to selected H0 posterior smoke
        run: python -m pytest tests/test_end_to_end_inclusion_h0_smoke.py -q
      - name: Test independently audited shared-inclusion H0 smoke artifacts
        run: python -m pytest tests/test_inclusion_posterior_smoke.py -q
      - name: Test event truth reconstruction against parent population and generating H0
        run: python -m pytest tests/test_audit_event_truth_consistency.py -q
      - name: Run independent-validation shared-inclusion H0 quadrature smoke
        run: python scripts/run_independent_validation_inclusion_h0_smoke.py --n-parent 1200 --n-detected 4 --n-validation-frame 1500 --n-validation 200 --orders 5,7,9,11 --h0-points 41 --output-dir artifacts/independent_validation_inclusion_h0_smoke
      - name: Independently audit raw independent-validation H0 smoke artifacts
        run: python scripts/audit_independent_validation_inclusion_h0_smoke.py artifacts/independent_validation_inclusion_h0_smoke --output artifacts/independent_validation_inclusion_h0_smoke/audit_report.json
      - name: Test normalized H0 posterior and grid-refinement diagnostics
        run: python -m pytest tests/test_h0_posterior.py -q
      - name: Test downstream H0 likelihood convergence across inclusion quadrature orders
        run: python -m pytest tests/test_inclusion_h0_convergence.py -q
      - name: Test inclusion-coefficient prior-scale sensitivity through H0
        run: python -m pytest tests/test_inclusion_prior_sensitivity.py -q
      - name: Test multi-replicate inclusion posterior calibration utilities
        run: python -m pytest tests/test_inclusion_posterior_calibration.py -q
      - name: Validate calibration runner command-line interface
        run: python scripts/run_inclusion_posterior_calibration.py --help
      - name: Test independent calibration orchestration and nested-design auditor
        run: python -m pytest tests/test_audit_inclusion_posterior_calibration.py -q
      - name: Run and verify tiny conditional H0 PIT and fixed-truth calibration orchestration (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_inclusion_posterior_calibration.py \
            --replicates 1 \
            --experiments H0_PIT_FIXED_INCLUSION_TRUTH,FIXED_TRUTH \
            --floors 0.0 \
            --validation-sizes 80 \
            --n-validation-frame 500 \
            --n-parent 800 --n-detected 3 \
            --orders 3,5,7,9 --h0-points 21 \
            --density-tolerance 0.01 --quantile-tolerance 0.5 \
            --consecutive-passes 1 \
            --output-dir artifacts/inclusion_posterior_calibration_smoke
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/inclusion_posterior_calibration_smoke")
          planned = pd.read_csv(root / "planned_cells.csv")
          ledger = pd.read_csv(root / "replicate_ledger.csv")
          summary = json.loads((root / "calibration_summary.json").read_text())
          assert len(planned) == 2
          assert len(ledger) == 2
          assert summary["planned_cells"] == 2
          assert summary["attempted"] == 2
          assert set(ledger["status"]) <= {"SUCCESS", "NON_EVALUABLE"}
          assert (ledger["audit_status"] == "PASS").all()
          assert summary["pit_estimand"].startswith("H0 prior-predictive PIT")
          PY
          python scripts/audit_inclusion_posterior_calibration.py artifacts/inclusion_posterior_calibration_smoke --output artifacts/inclusion_posterior_calibration_smoke/independent_audit_report.json
      - name: Test independent finite-validation raw-record auditor
        run: python -m pytest tests/test_audit_finite_validation_probability_benchmark.py -q
      - name: Run paired finite-validation inclusion-probability smoke benchmark
        run: python scripts/run_finite_validation_probability_benchmark.py --n-parent 1200 --replicates 3 --seed 20261108 --output artifacts/finite_validation_probability_smoke/replicates.csv --raw-output artifacts/finite_validation_probability_smoke/raw_unit_records.csv
      - name: Independently reconstruct finite-validation scores and IPW diagnostics
        run: python scripts/audit_finite_validation_probability_benchmark.py artifacts/finite_validation_probability_smoke --output artifacts/finite_validation_probability_smoke/audit_report.json
      - name: Run configured finite-validation probability pilot (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/run_finite_validation_probability_benchmark.py --config configs/finite_validation_probability_pilot_v1.json --output artifacts/finite_validation_probability_pilot/replicates.csv --raw-output artifacts/finite_validation_probability_pilot/raw_unit_records.csv
      - name: Independently audit configured finite-validation probability pilot (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/audit_finite_validation_probability_benchmark.py artifacts/finite_validation_probability_pilot --output artifacts/finite_validation_probability_pilot/audit_report.json
      - name: Test finite-validation IPW host-density recovery and independent auditor
        run: python -m pytest tests/test_finite_validation_density_recovery.py -q
      - name: Run finite-validation density-recovery smoke benchmark
        run: python scripts/run_finite_validation_density_recovery.py --replicates 1 --n-parent 1200 --grid-points 201 --output-dir artifacts/finite_validation_density_recovery_smoke
      - name: Independently audit finite-validation density-recovery smoke artifacts
        run: python scripts/audit_finite_validation_density_recovery.py --artifact-dir artifacts/finite_validation_density_recovery_smoke --output artifacts/finite_validation_density_recovery_smoke/audit_report.json
      - name: Test host-density-to-H0 benchmark
        run: python -m pytest tests/test_host_density_benchmark.py -q
      - name: Run small host-density-to-H0 benchmark smoke experiment
        run: python scripts/run_host_density_benchmark.py --replicates 1 --n-parent 1200 --n-detected 8 --h0-points 51 --z-points 201 --output-dir artifacts/host_density_benchmark_smoke
      - name: Test independent host-density benchmark artifact audit
        run: python -m pytest tests/test_audit_host_density_benchmark.py -q
      - name: Independently audit host-density benchmark smoke artifacts
        run: python scripts/audit_host_density_benchmark.py artifacts/host_density_benchmark_smoke
      - name: Test paired host-density H0-grid sensitivity and independent audit
        run: python -m pytest tests/test_host_density_grid_sensitivity.py -q
      - name: Run paired host-density H0-grid sensitivity experiment (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/run_host_density_grid_sensitivity.py --replicates 5 --n-parent 3000 --n-detected 20 --grid-points 161,321,641,1281,3201 --z-points 301 --output-dir artifacts/host_density_grid_sensitivity
      - name: Independently audit host-density H0-grid convergence (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/audit_host_density_grid_sensitivity.py artifacts/host_density_grid_sensitivity --tolerance 0.01 --output artifacts/host_density_grid_sensitivity/audit_report.json
      - name: Test paired distance-uncertainty sensitivity experiment
        run: python -m pytest tests/test_uncertainty_sensitivity.py -q
      - name: Run paired distance-uncertainty sensitivity smoke experiment
        run: python scripts/run_distance_uncertainty_sensitivity.py --replicates 2 --seed 20261026 --output-dir artifacts/distance_uncertainty_sensitivity
      - name: Test independent distance-uncertainty artifact audit
        run: python -m pytest tests/test_audit_distance_uncertainty_sensitivity.py -q
      - name: Independently reconstruct distance-uncertainty raw records and summaries
        run: python scripts/audit_distance_uncertainty_sensitivity.py artifacts/distance_uncertainty_sensitivity
      - name: Test overflow-safe host-weight normalization across inference models
        run: python -m pytest tests/test_cosmological_inference_weight_normalization.py -q
      - name: Test joint selection and missing-host compatibility limits
        run: python -m pytest tests/test_joint_selection_missing_hosts.py -q
      - name: Test selected-likelihood calibration runner determinism and summary invariants
        run: python -m pytest tests/test_selected_likelihood_sbc.py -q
      - name: Run reproducible selected-likelihood PIT calibration
        run: python scripts/run_selected_likelihood_sbc.py --replicates 1000 --output-dir artifacts/selected_likelihood_sbc
      - name: Independently audit raw PIT records and summary
        run: python scripts/audit_selected_likelihood_sbc.py
      - name: Compare selected-likelihood PIT calibration across grid resolutions
        run: python scripts/run_calibration_grid_sensitivity.py --replicates 300 --seed 20261025 --grid-points 1201,2401,4801 --output-dir artifacts/calibration_grid_sensitivity
      - name: Independently audit paired grid-sensitivity comparison and summary statistics
        run: python scripts/audit_calibration_grid_sensitivity.py artifacts/calibration_grid_sensitivity
      - name: Test calibration grid-sensitivity experiment
        run: python -m pytest tests/test_calibration_grid_sensitivity.py tests/test_audit_calibration_grid_sensitivity.py -q
      - name: Test multi-seed paired grid-sensitivity aggregation and independent audit
        run: python -m pytest tests/test_multiseed_grid_sensitivity.py tests/test_audit_multiseed_grid_sensitivity.py -q
      - name: Run independently audited multi-seed grid-sensitivity smoke experiment
        run: python scripts/run_multiseed_grid_sensitivity.py --replicates 100 --seeds 101,202 --grid-points 1201,2401 --output-dir artifacts/multiseed_grid_sensitivity
      - name: Independently audit multi-seed aggregate artifacts
        run: python scripts/audit_multiseed_grid_sensitivity.py artifacts/multiseed_grid_sensitivity
      - name: Test independent paired host-weight contrast reconstruction
        run: python -m pytest tests/test_paired_host_weight_contrasts.py -q
      - name: Test host-misspecification stress test and independent reconstruction audit
        run: python -m pytest tests/test_host_misspecification_audit.py -q
      - name: Test equal-cell host sensitivity summary and paired bootstrap
        run: python -m pytest tests/test_summarize_host_misspecification_sensitivity_surface.py -q
      - name: Test prior-support × hidden-host factorial and independent audit
        run: python -m pytest tests/test_host_prior_support_factorial.py -q
      - name: Test equal-cell prior-support marginal summaries
        run: python -m pytest tests/test_summarize_host_prior_support_factorial.py -q
      - name: Test hidden-host fraction/redshift assumption sensitivity
        run: python -m pytest tests/test_hidden_host_assumption_sensitivity.py -q
      - name: Test marginal hidden-host assumption summaries
        run: python -m pytest tests/test_summarize_hidden_host_assumption_sensitivity.py -q
      - name: Test checksum-verified CHIMERA benchmark-data preparation
        run: python -m pytest tests/test_prepare_chimera_v2_benchmark_data.py -q
      - name: Run focused grid-convergence regression tests
        run: python -m pytest tests/test_targeted_grid_convergence.py tests/test_grid_refinement_audit.py -q
      - name: Test extreme posterior-grid resolution audit
        run: python -m pytest tests/test_extreme_grid_resolution_audit.py -q
      - name: Test fixed-truth coverage reference-interval audit
        run: python -m pytest tests/test_audit_fixed_truth_coverage_reference_interval.py -q
      - name: Run deterministic extreme posterior-grid resolution audit
        run: python scripts/audit_extreme_grid_resolution.py --output artifacts/extreme_grid_resolution_audit.json
      - name: Test independent distance-uncertainty grid-stability reconstruction
        run: python -m pytest tests/test_check_distance_uncertainty_grid_stability.py -q
      - name: Run posterior-grid stability diagnostic
        run: python scripts/run_posterior_grid_stability.py --output artifacts/posterior_grid_stability.csv
      - name: Run targeted upper-tail convergence diagnostic
        run: python scripts/run_targeted_grid_convergence.py --output artifacts/targeted_grid_convergence.csv
      - name: Run full 300-replicate distance-uncertainty sensitivity experiment (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/run_distance_uncertainty_sensitivity.py --replicates 300 --seed 20261026 --grid-points 1601 --bootstrap-resamples 2000 --output-dir artifacts/distance_uncertainty_sensitivity_full
      - name: Independently audit full distance-uncertainty experiment (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/audit_distance_uncertainty_sensitivity.py artifacts/distance_uncertainty_sensitivity_full
      - name: Compare fixed-truth Bayesian coverage with inverted Gaussian reference intervals (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/audit_fixed_truth_coverage_reference_interval.py artifacts/distance_uncertainty_sensitivity_full/replicates.csv --output artifacts/fixed_truth_coverage_reference_interval_audit.json
      - name: Summarize paired likelihood contrasts with stratified bootstrap (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/summarize_distance_uncertainty_paired_contrasts.py artifacts/distance_uncertainty_sensitivity_full/replicates.csv --seed 4182026 --bootstrap-resamples 10000
      - name: Independently recompute full-run posteriors on a finer grid (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: python scripts/check_distance_uncertainty_grid_stability.py artifacts/distance_uncertainty_sensitivity_full/replicates.csv --fine-grid-points 3201 --max-allowed-change 0.001
      - name: Run and independently audit catalogue-thinning calibration (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_catalogue_thinning_audit.py --n-parent 40000 --seed 20261028 --output-dir artifacts/catalogue_thinning
          python scripts/audit_catalogue_thinning_audit.py artifacts/catalogue_thinning
      - name: Upload numerical diagnostic results
        uses: actions/upload-artifact@v4
        with:
          name: numerical-diagnostics-py${{ matrix.python-version }}
          path: |
            artifacts/posterior_grid_stability.csv
            artifacts/targeted_grid_convergence.csv
            artifacts/extreme_grid_resolution_audit.json
            artifacts/fixed_truth_coverage_reference_interval_audit.json
            artifacts/host_density_grid_sensitivity/
            artifacts/distance_uncertainty_sensitivity/
            artifacts/distance_uncertainty_sensitivity_full/
            artifacts/selected_likelihood_sbc/pit_replicates.csv
            artifacts/selected_likelihood_sbc/pit_summary.json
            artifacts/selected_likelihood_sbc/audit_report.json
            artifacts/calibration_grid_sensitivity/
            artifacts/multiseed_grid_sensitivity/
            artifacts/catalogue_thinning/
            artifacts/finite_validation_probability_smoke/
            artifacts/finite_validation_probability_pilot/
            artifacts/finite_validation_density_recovery_smoke/
            artifacts/independent_validation_inclusion_h0_smoke/
            artifacts/inclusion_posterior_calibration_smoke/
            artifacts/five_arm_smoke/
            artifacts/five_arm_smoke_audit.json
            artifacts/five_arm_replicates_smoke/
          if-no-files-found: error

