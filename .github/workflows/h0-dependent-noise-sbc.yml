name: h0-dependent-noise-sbc

on:
  push:
    branches:
      - research/audit-posterior-grid-integrity
    paths:
      - "src/dark_siren_robustness/selection_conditioned_h0_dependent_noise.py"
      - "scripts/run_h0_dependent_noise_sbc.py"
      - "scripts/audit_h0_dependent_noise_sbc.py"
      - "tests/test_selection_conditioned_h0_dependent_noise.py"
      - ".github/workflows/h0-dependent-noise-sbc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h0-dependent-noise-sbc-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  simulation-and-independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test H0-dependent-noise selection likelihood and calibration guards
        run: python -m pytest tests/test_selection_conditioned_h0_dependent_noise.py -q
      - name: Run 300-replicate-per-mode calibration study
        run: python scripts/run_h0_dependent_noise_sbc.py --replicates 300 --seed 20261030 --output-dir artifacts/h0_dependent_noise_sbc
      - name: Independently replay seeds, detected distances, likelihoods, and posterior summaries
        run: python scripts/audit_h0_dependent_noise_sbc.py artifacts/h0_dependent_noise_sbc --output artifacts/h0_dependent_noise_sbc/audit_report.json
      - name: Upload raw records, summary, manifest, and independent audit
        uses: actions/upload-artifact@v4
        with:
          name: h0-dependent-noise-sbc-${{ github.sha }}
          path: artifacts/h0_dependent_noise_sbc/
          if-no-files-found: error
          retention-days: 90
