name: Toy single-host selection SBC

on:
  push:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/selection.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_single_host_selection_sbc.py"
      - "tests/test_single_host_selection_sbc.py"
      - ".github/workflows/single-host-selection-sbc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-host-sbc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run single-host selection SBC
        run: python scripts/run_single_host_selection_sbc.py --replicates 2000 --seed 20261031 --grid-size 4001 --output-dir results/single-host-selection-sbc
      - name: Run focused tests
        run: python -m pytest tests/test_single_host_selection_sbc.py -q
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: single-host-selection-sbc-results
          path: results/single-host-selection-sbc/
          if-no-files-found: error
          retention-days: 90
