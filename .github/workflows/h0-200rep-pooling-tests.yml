name: h0-200rep-pooling-tests

on:
  push:
    branches:
      - research/h0-200rep-pooled-calibration-audit-20261119
    paths:
      - .github/workflows/h0-200rep-pooling-tests.yml
      - scripts/pool_h0_100rep_calibration_replicates.py
      - tests/test_pool_h0_100rep_calibration_replicates.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h0-200rep-pooling-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pooling-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile and test pooled calibration audit
        run: |
          python -m py_compile scripts/pool_h0_100rep_calibration_replicates.py
          pytest tests/test_pool_h0_100rep_calibration_replicates.py -q
