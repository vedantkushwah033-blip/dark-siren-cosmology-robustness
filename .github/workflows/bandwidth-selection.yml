name: parent-density-bandwidth-selection

on:
  push:
    branches:
      - research/five-arm-comparison-preregistration-20261113
  workflow_dispatch:

concurrency:
  group: parent-density-bandwidth-selection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bandwidth-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run preregistered 200-replicate parent-density bandwidth source experiment
        run: |
          python scripts/run_parent_density_bandwidth_pilot.py \
            --replicates 200 --n-parent 4000 --seed 20261114 \
            --grid-points 801 \
            --bandwidth-multipliers 0.05,0.08,0.10,0.12,0.15,0.20,0.25,0.30,0.40 \
            --output-dir artifacts/parent_density_bandwidth_source
      - name: Independently reconstruct all source IAE values and hashes
        run: |
          python scripts/audit_parent_density_bandwidth_pilot.py \
            artifacts/parent_density_bandwidth_source \
            --output artifacts/parent_density_bandwidth_source_audit.json
      - name: Select bandwidth using training replicates only
        run: |
          python scripts/select_bandwidth_train_holdout.py \
            artifacts/parent_density_bandwidth_source \
            --output artifacts/parent_density_bandwidth_selection.json \
            --split-seed 20261113 --training-fraction 0.70
      - name: Independently audit training selection and untouched holdout scores
        run: |
          python scripts/audit_bandwidth_train_holdout.py \
            artifacts/parent_density_bandwidth_source \
            artifacts/parent_density_bandwidth_selection.json \
            --output artifacts/parent_density_bandwidth_selection_audit.json
      - name: Enforce complete audit gates and print frozen selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("artifacts/parent_density_bandwidth_source_audit.json").read_text())
          selection = json.loads(Path("artifacts/parent_density_bandwidth_selection.json").read_text())
          audit = json.loads(Path("artifacts/parent_density_bandwidth_selection_audit.json").read_text())
          assert source["status"] == "PASS", source
          assert audit["status"] == "PASS", audit
          assert selection["status"] == "PASS_SELECTION_ONLY_NOT_CONFIRMATORY", selection
          assert selection["selected_multiplier"] in selection["candidate_multipliers"]
          assert set(selection["training_replicate_ids"]).isdisjoint(selection["holdout_replicate_ids"])
          assert len(selection["training_replicates"]) + len(selection["holdout_replicates"]) == 200
          print(json.dumps({
              "status": "PASS",
              "selected_bandwidth_multiplier": selection["selected_bandwidth_multiplier"],
              "training_replicates": len(selection["training_replicates"]),
              "holdout_replicates": len(selection["holdout_replicates"]),
              "holdout_scores": selection["holdout_scores"],
              "interpretation": "Synthetic parent-density bandwidth selection only; no H0 inference."
          }, indent=2, sort_keys=True))
          PY
      - name: Upload immutable bandwidth-selection source and audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parent-density-bandwidth-selection-${{ github.sha }}
          path: |
            artifacts/parent_density_bandwidth_source/
            artifacts/parent_density_bandwidth_source_audit.json
            artifacts/parent_density_bandwidth_selection.json
            artifacts/parent_density_bandwidth_selection_audit.json
          if-no-files-found: error
          retention-days: 30
