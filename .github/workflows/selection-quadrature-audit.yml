name: Selection posterior quadrature audit

on:
  push:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/selection.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_selection_quadrature_audit.py"
      - "tests/test_selection_quadrature_audit.py"
      - ".github/workflows/selection-quadrature-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quadrature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run adaptive quadrature audit and validate CSV artifact
        run: python scripts/run_selection_quadrature_audit.py --grid-size 4001 --output-dir results/selection-quadrature-audit
      - name: Run focused tests
        run: python -m pytest tests/test_selection_quadrature_audit.py -q
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: selection-quadrature-audit-python-${{ matrix.python-version }}
          path: results/selection-quadrature-audit/quadrature_comparison.csv
          if-no-files-found: error
          retention-days: 90
