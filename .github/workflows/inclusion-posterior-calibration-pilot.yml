name: inclusion-posterior-calibration-pilot

on:
  push:
    branches:
      - research/inclusion-posterior-quadrature-prototype
    paths:
      - .github/workflows/inclusion-posterior-calibration-pilot.yml
  workflow_dispatch:

concurrency:
  group: inclusion-posterior-calibration-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-calibration-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run 20-replicate paired conditional-PIT and fixed-truth pilot
        run: |
          python scripts/run_inclusion_posterior_calibration.py \
            --replicates 20 \
            --seed 20261108 \
            --experiments H0_PIT_FIXED_INCLUSION_TRUTH,FIXED_TRUTH \
            --floors 0.0,0.10,0.25 \
            --validation-sizes 100,300,1000 \
            --n-validation-frame 4000 \
            --n-parent 2400 \
            --n-detected 8 \
            --h0-points 81 \
            --orders 7,11,15,19 \
            --output-dir artifacts/inclusion_posterior_calibration_pilot
      - name: Independently audit all replicate artifacts and aggregate summaries
        run: |
          python scripts/audit_inclusion_posterior_calibration.py \
            artifacts/inclusion_posterior_calibration_pilot \
            --output artifacts/inclusion_posterior_calibration_pilot/independent_audit_report.json
      - name: Validate pilot completion and preserve explicit failure accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/inclusion_posterior_calibration_pilot")
          planned = pd.read_csv(root / "planned_cells.csv")
          ledger = pd.read_csv(root / "replicate_ledger.csv")
          summary = json.loads((root / "calibration_summary.json").read_text())
          audit = json.loads((root / "independent_audit_report.json").read_text())
          assert len(planned) == 360
          assert len(ledger) == 360
          assert summary["planned_cells"] == 360
          assert summary["attempted"] == 360
          assert audit["status"] == "PASS"
          assert set(ledger["status"]) <= {"SUCCESS", "NON_EVALUABLE", "FAILED", "NOT_RUN"}
          assert sum(summary["status_counts"].values()) == 360
          print(json.dumps({
              "planned": len(planned),
              "attempted": summary["attempted"],
              "status_counts": summary["status_counts"],
              "audit": audit["status"],
              "interpretation": "pilot only; not confirmatory calibration",
          }, indent=2))
          PY
      - name: Upload complete pilot ledger, raw replicate artifacts and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inclusion-posterior-calibration-pilot-py3.12
          path: artifacts/inclusion_posterior_calibration_pilot/
          if-no-files-found: warn
          retention-days: 90
