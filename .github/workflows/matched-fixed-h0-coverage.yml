name: Matched fixed-H0 coverage audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/matched-fixed-h0-coverage.yml"
      - "scripts/run_matched_fixed_h0_coverage.py"
      - "tests/test_matched_fixed_h0_coverage.py"
      - "scripts/analyze_matched_host_paired_differences.py"
      - "scripts/test_host_mixture_identities.py"
      - "tests/test_matched_host_paired_differences.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy scipy pytest
      - name: Test coverage calculations
        run: python -m pytest -q tests/test_matched_fixed_h0_coverage.py tests/test_matched_host_paired_differences.py
      - name: Fetch pinned original simulator
        run: |
          git clone https://github.com/vedantkushwah033-blip/bayesian-dark-siren-cosmology.git original-project
          git -C original-project checkout b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f
          python -m pip install -r original-project/requirements.txt
      - name: Test deterministic host-mixture identities
        run: python scripts/test_host_mixture_identities.py --original-dir original-project
      - name: Run matched fixed-H0 coverage
        run: |
          python scripts/run_matched_fixed_h0_coverage.py \
            --original-dir original-project --replicates 500 --seed 20261023 \
            --output-dir results/matched-fixed-h0-coverage
      - name: Paired known-host versus unknown-host bootstrap
        run: python scripts/analyze_matched_host_paired_differences.py --input results/matched-fixed-h0-coverage/per_run.csv --output results/matched-fixed-h0-coverage/paired_comparison.csv --bootstrap 10000 --seed 20261023
      - name: Validate output shape
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("results/matched-fixed-h0-coverage")
          with (p/"summary.csv").open(newline="") as f: s=list(csv.DictReader(f))
          with (p/"per_run.csv").open(newline="") as f: r=list(csv.DictReader(f))
          assert len(s)==14, len(s)
          assert len(r)==7000, len(r)
          with (p/"paired_comparison.csv").open(newline="") as f: d=list(csv.DictReader(f))
          assert len(d)==49, len(d)
          assert all(int(x["replicates"])==500 for x in s)
          print(f"Validated {len(s)} summaries and {len(r)} fits.")
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: matched-fixed-h0-coverage
          path: results/matched-fixed-h0-coverage/
          if-no-files-found: error
          retention-days: 30
