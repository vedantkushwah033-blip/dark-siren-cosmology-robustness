name: Targeted 1000-replicate SBC boundary grid audit

on:
  push:
    branches:
      - research/sbc-1000-boundary-grid-audit-20261119
  pull_request:
    branches:
      - research/full-parent-joint-sbc-1000rep-20261119
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sbc-1000-boundary-grid-audit-20261119
  cancel-in-progress: false

jobs:
  targeted-grid-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile and test targeted audit
        run: |
          python -m py_compile scripts/audit_sbc_1000_boundary_grid.py
          pytest -q tests/test_sbc_1000_boundary_grid.py
      - name: Verify immutable 1000-replicate SBC source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(gh api repos/vedantkushwah033-blip/dark-siren-cosmology-robustness/actions/runs/44440102723 --jq '.status + ":" + (.conclusion // "")')
          test "$result" = "completed:success"
      - name: Download immutable 1000-replicate SBC source artifact
        uses: actions/download-artifact@v4
        with:
          name: full-parent-h0-sbc-1000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44440102723
          path: artifacts/full_parent_h0_sbc_1000
      - name: Reconstruct targeted boundary replicates on 1121, 2241, 4481, and 17921 grids
        run: |
          python scripts/audit_sbc_1000_boundary_grid.py artifacts/full_parent_h0_sbc_1000 \
            --intermediate-points 2241 \
            --fine-points 4481 \
            --extra-points 8961 \
            --output-dir artifacts/sbc_1000_boundary_grid_audit
      - name: Upload targeted boundary grid readout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbc-1000-boundary-grid-audit
          path: |
            artifacts/sbc_1000_boundary_grid_audit/sbc_1000_boundary_grid_summary.json
            artifacts/sbc_1000_boundary_grid_audit/sbc_1000_boundary_grid_replicates.csv
          if-no-files-found: warn
          retention-days: 90
