name: h0-100rep-calibration-precision

on:
  push:
    branches:
      - research/h0-100rep-calibration-precision-20261119
    paths:
      - .github/workflows/h0-100rep-calibration-precision.yml
      - scripts/run_quadratic_logit_h0_calibration_pilot.py
      - scripts/audit_quadratic_logit_h0_calibration_pilot.py
      - tests/test_quadratic_logit_h0_calibration_pilot_audit.py
      - src/dark_siren_robustness/**
  workflow_dispatch:

concurrency:
  group: h0-100rep-calibration-precision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-fixed-truth-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile runner and auditor; run independent-audit regressions
        run: |
          python -m py_compile scripts/run_quadratic_logit_h0_calibration_pilot.py scripts/audit_quadratic_logit_h0_calibration_pilot.py
          pytest tests/test_quadratic_logit_h0_calibration_pilot_audit.py -q
      - name: Run 100-replicate paired fixed-truth calibration experiment
        run: |
          python scripts/run_quadratic_logit_h0_calibration_pilot.py \
            --replicates 100 \
            --seed 2026111927 \
            --gammas=-1,0,1 \
            --validation-sizes 100,500 \
            --n-validation-frame 500 \
            --n-parent 1200 \
            --n-detected 4 \
            --h0-true 70 \
            --h0-points 281 \
            --prior-min 20 \
            --prior-max 300 \
            --orders 3,5,7,9 \
            --density-tolerance 0.001 \
            --quantile-tolerance 0.05 \
            --consecutive-passes 2 \
            --output-dir artifacts/h0_100rep_calibration_precision
      - name: Compute Monte Carlo precision and paired contrasts
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path("artifacts/h0_100rep_calibration_precision")
          ledger=pd.read_csv(root/"replicate_ledger.csv")
          def wilson(k,n,z=1.959963984540054):
              if n==0: return (float("nan"),float("nan"))
              p=k/n; den=1+z*z/n
              center=(p+z*z/(2*n))/den
              half=z*math.sqrt(p*(1-p)/n+z*z/(4*n*n))/den
              return center-half,center+half
          rows=[]
          for (gamma,nval),g in ledger.groupby(["gamma","n_validation"]):
              ok=g[g.status=="SUCCESS"]
              n=len(ok)
              row={"gamma":gamma,"n_validation":int(nval),"planned":len(g),"success":n,
                   "non_evaluable":int((g.status=="NON_EVALUABLE").sum()),
                   "failed":int((g.status=="FAILED").sum()),
                   "not_run":int((g.status=="NOT_RUN").sum())}
              if n:
                  for col in ("covered68","covered90","covered95"):
                      k=int(ok[col].sum()); lo,hi=wilson(k,n)
                      row[col]=k/n; row[col+"_mcse"]=math.sqrt((k/n)*(1-k/n)/n)
                      row[col+"_wilson95_low"]=lo; row[col+"_wilson95_high"]=hi
                  bias=ok.median_bias.to_numpy(float)
                  row.update({"mean_median_bias":float(bias.mean()),
                              "rmse":float(np.sqrt(np.mean(bias*bias))),
                              "mean_width68":float(ok.width68.mean()),
                              "median_min_kish_ess":float(ok.min_catalogue_kish_ess.median()),
                              "median_max_normalized_weight":float(ok.max_normalized_weight.median())})
              rows.append(row)
          pd.DataFrame(rows).to_csv(root/"coverage_precision_summary.csv",index=False)
          paired=[]
          for nval in (100,500):
              wide=ledger[ledger.n_validation==nval].pivot(index="replicate",columns="gamma",values="median_bias")
              if {-1.0,0.0,1.0}.issubset(set(wide.columns)):
                  d=wide[1.0]-wide[-1.0]
                  paired.append({"contrast":"gamma +1 minus gamma -1 median bias",
                                 "n_validation":nval,"paired_replicates":int(d.notna().sum()),
                                 "mean_difference":float(d.mean()),"sd_difference":float(d.std(ddof=1)),
                                 "mcse":float(d.std(ddof=1)/math.sqrt(d.notna().sum()))})
          for gamma in (-1.0,0.0,1.0):
              wide=ledger[ledger.gamma==gamma].pivot(index="replicate",columns="n_validation",values="median_bias")
              d=wide[500]-wide[100]
              paired.append({"contrast":"n_validation 500 minus 100 median bias",
                             "gamma":gamma,"paired_replicates":int(d.notna().sum()),
                             "mean_difference":float(d.mean()),"sd_difference":float(d.std(ddof=1)),
                             "mcse":float(d.std(ddof=1)/math.sqrt(d.notna().sum()))})
          pd.DataFrame(paired).to_csv(root/"paired_bias_contrasts.csv",index=False)
          print(pd.DataFrame(rows).to_string(index=False))
          print(pd.DataFrame(paired).to_string(index=False))
          PY
      - name: Refresh aggregate manifest after precision summaries
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("artifacts/h0_100rep_calibration_precision")
          if root.exists():
              manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in sorted(root.rglob("*")) if p.is_file() and p.name!="manifest.json"}
              (root/"manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True))
          PY
      - name: Independently audit all cells, nested validation, child artifacts and summaries
        if: always()
        run: |
          if [ -f artifacts/h0_100rep_calibration_precision/replicate_ledger.csv ]; then
            python scripts/audit_quadratic_logit_h0_calibration_pilot.py \
              artifacts/h0_100rep_calibration_precision \
              --output artifacts/h0_100rep_calibration_precision/independent_orchestration_audit.json
          fi
      - name: Assert complete 600-cell run and report every status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("artifacts/h0_100rep_calibration_precision")
          ledger=pd.read_csv(root/"replicate_ledger.csv")
          report=json.loads((root/"independent_orchestration_audit.json").read_text())
          assert len(ledger)==600, len(ledger)
          assert report["status"]=="PASS", report
          assert report["planned_cells"]==600
          assert report["status_counts"].get("NOT_RUN",0)==0
          assert report["status_counts"].get("RUNNING",0)==0
          print(json.dumps(report,indent=2))
          print(ledger.status.value_counts().to_string())
          PY
      - name: Upload full raw experiment and audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0-100rep-calibration-precision-py3.12
          path: artifacts/h0_100rep_calibration_precision/
          if-no-files-found: warn
          retention-days: 90
