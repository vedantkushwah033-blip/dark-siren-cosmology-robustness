name: Quadratic-curvature H0 propagation smoke

on:
  push:
    branches:
      - research/quadratic-curvature-h0-smoke-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h0-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run curvature-matched H0 smoke
        run: |
          python scripts/run_quadratic_curvature_h0_smoke.py \
            --gamma 1.0 \
            --orders 5,7 \
            --output-dir artifacts/quadratic_curvature_h0_smoke
      - name: Independently audit reconstructed H0 likelihood artifact
        run: python scripts/audit_quadratic_curvature_h0_artifact.py artifacts/quadratic_curvature_h0_smoke
      - name: Upload observable, truth-separated and posterior artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-curvature-h0-smoke-${{ github.sha }}
          path: artifacts/quadratic_curvature_h0_smoke/
          if-no-files-found: error
          retention-days: 14
