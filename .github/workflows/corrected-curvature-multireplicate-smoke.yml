name: corrected-curvature-multireplicate-smoke

on:
  push:
    branches:
      - research/curvature-multireplicate-smoke-20261118

permissions:
  contents: read

concurrency:
  group: corrected-curvature-multireplicate-smoke
  cancel-in-progress: false

jobs:
  curvature-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run two-replicate quadratic-logit curvature density pilot
        run: |
          python scripts/run_absolute_bandwidth_density_replicates.py \
            --master-seed 2026111811 \
            --seed-stride 10 \
            --replicates 2 \
            --n-parent 700 \
            --validation-frame 300 \
            --validation-sizes 80,160 \
            --gamma 0.5 \
            --beta -3.9 \
            --scott-multiplier 0.7 \
            --quadrature-order 3 \
            --grid-points 101 \
            --absolute-widths 0.012,0.024 \
            --output-dir artifacts/curvature_multireplicate_smoke
      - name: Independently audit multi-replicate orchestration and each raw replicate
        run: |
          python scripts/audit_absolute_bandwidth_density_replicates.py \
            artifacts/curvature_multireplicate_smoke \
            --output artifacts/curvature_multireplicate_smoke/outer_independent_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/curvature_multireplicate_smoke/outer_independent_audit.json")
          report = json.loads(p.read_text())
          print(json.dumps(report, indent=2, sort_keys=True))
          assert report.get("status") == "PASS", report
          assert report.get("planned_replicates") == 2, report
          assert report.get("successful_replicates") == 2, report
          assert report.get("failed_replicates") == 0, report
          assert report.get("child_raw_audits_passed") == 2, report
          PY
      - name: Upload raw replicate inputs, outputs, manifests, and audit
        uses: actions/upload-artifact@v4
        with:
          name: corrected-curvature-multireplicate-smoke-${{ github.sha }}
          path: artifacts/curvature_multireplicate_smoke/
          if-no-files-found: error
          retention-days: 14
