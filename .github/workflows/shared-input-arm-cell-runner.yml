name: shared-input-arm-cell-runner

on:
  push:
    paths:
      - "src/dark_siren_robustness/arm_cell_execution.py"
      - "src/dark_siren_robustness/shared_input_bundle.py"
      - "scripts/run_arm_cell_from_bundle.py"
      - "scripts/audit_arm_cell_from_bundle.py"
      - "scripts/run_arm_cell_plan.py"
      - "scripts/audit_arm_cell_plan.py"
      - "scripts/run_audited_arm_cell.py"
      - "tests/test_arm_cell_execution.py"
      - "tests/test_run_arm_cell_from_bundle.py"
      - "tests/test_audit_arm_cell_from_bundle.py"
      - "tests/test_run_arm_cell_plan.py"
      - "tests/test_audit_arm_cell_plan.py"
      - "tests/test_shared_input_bundle.py"
      - ".github/workflows/shared-input-arm-cell-runner.yml"
  pull_request:
    paths:
      - "src/dark_siren_robustness/arm_cell_execution.py"
      - "src/dark_siren_robustness/shared_input_bundle.py"
      - "scripts/run_arm_cell_from_bundle.py"
      - "scripts/audit_arm_cell_from_bundle.py"
      - "scripts/run_audited_arm_cell.py"
      - "scripts/run_arm_cell_plan.py"
      - "tests/test_arm_cell_execution.py"
      - "tests/test_run_arm_cell_from_bundle.py"
      - "tests/test_audit_arm_cell_from_bundle.py"
      - "tests/test_run_audited_arm_cell.py"
      - "tests/test_run_arm_cell_plan.py"
      - "tests/test_shared_input_bundle.py"
      - ".github/workflows/shared-input-arm-cell-runner.yml"

concurrency:
  group: shared-input-arm-cell-runner-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  arm-cell-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test frozen shared-input bundle, arm-cell evaluator, and single-cell runner
        run: python -m pytest tests/test_shared_input_bundle.py tests/test_arm_cell_execution.py tests/test_run_arm_cell_from_bundle.py tests/test_audit_arm_cell_from_bundle.py tests/test_run_audited_arm_cell.py tests/test_run_arm_cell_plan.py tests/test_audit_arm_cell_plan.py -q
      - name: Validate one-cell runner CLI
        run: python scripts/run_arm_cell_from_bundle.py --help
      - name: Validate independent cell auditor CLI
        run: python scripts/audit_arm_cell_from_bundle.py --help
      - name: Validate audit-gated cell runner CLI
        run: python scripts/run_audited_arm_cell.py --help
      - name: Validate serial cell-plan coordinator CLI
        run: python scripts/run_arm_cell_plan.py --help
      - name: Generate a small frozen five-arm input bundle (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_quadratic_five_arm_smoke.py \
            --seed 20261122 --validation-seed 20261123 --n-parent 400 \
            --n-detected 4 --validation-frame 300 --validation-sizes 100,200 \
            --h0-points 41 --quadrature-order 3 \
            --output-dir artifacts/shared_input_bundle_smoke
      - name: Execute A through E as independent cells (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          for arm in A_catalogue_only B_parent_oracle C_known_probability_ipw D_map_plugin_ipw E_uncertainty_integrated_ipw; do
            python scripts/run_arm_cell_from_bundle.py \
              --bundle-dir artifacts/shared_input_bundle_smoke \
              --output-dir "artifacts/arm_cells/$arm" \
              --replicate 1 --gamma 0.0 --validation-size 100 --arm "$arm"
            test -s "artifacts/arm_cells/$arm/cell_result.json"
            test -s "artifacts/arm_cells/$arm/cell_arrays.npz"
            test -s "artifacts/arm_cells/$arm/manifest.json"
            python scripts/audit_arm_cell_from_bundle.py \
              --bundle-dir artifacts/shared_input_bundle_smoke \
              --cell-dir "artifacts/arm_cells/$arm" \
              --output "artifacts/arm_cells/$arm/independent_audit.json"
          done
      - name: Run all five arms through the serial audited coordinator (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          arms = [
              "A_catalogue_only", "B_parent_oracle", "C_known_probability_ipw",
              "D_map_plugin_ipw", "E_uncertainty_integrated_ipw",
          ]
          cells = [{
              "replicate": 1, "gamma": 0.0, "validation_size": 100,
              "arm": arm, "bundle_dir": "shared_input_bundle_smoke",
              "output_dir": f"coordinated_cells/{arm}",
          } for arm in arms]
          with open("artifacts/arm_cell_plan.json", "w", encoding="utf-8") as stream:
              json.dump({"schema_version": 1, "cells": cells}, stream, indent=2)
          PY
          python scripts/run_arm_cell_plan.py \
            --plan artifacts/arm_cell_plan.json \
            --checkpoint artifacts/arm_cell_checkpoint.json
          python - <<'PY'
          from pathlib import Path
          from dark_siren_robustness.cell_ledger_store import read_checkpoint
          checkpoint = read_checkpoint("artifacts/arm_cell_checkpoint.json")
          rows = checkpoint["cell_ledger"]
          assert len(rows) == 5
          assert all(row["status"] == "SUCCESS" for row in rows), rows
          assert all(row["audit_status"] == "PASS" for row in rows), rows
          assert all(Path(row["audit_report_path"]).is_file() for row in rows), rows
          print("five-arm serial coordinator checkpoint: PASS")
          PY
          python scripts/audit_arm_cell_plan.py \
            --checkpoint artifacts/arm_cell_checkpoint.json \
            --output artifacts/arm_cell_checkpoint_independent_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/arm_cell_checkpoint_independent_audit.json").read_text())
          assert report["status"] == "PASS"
          assert report["run_status"] == "PASS"
          assert report["planned_cells"] == 5
          assert report["status_counts"]["SUCCESS"] == 5
          assert len(report["verified_audit_reports"]) == 5
          print("independent aggregate checkpoint audit: PASS")
          PY
      - name: Upload serial arm-cell smoke artifacts (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: serial-arm-cell-coordinator-smoke
          path: |
            artifacts/arm_cell_plan.json
            artifacts/arm_cell_checkpoint.json
            artifacts/arm_cell_checkpoint_independent_audit.json
            artifacts/coordinated_cells/
            artifacts/coordinated_cells/*.independent_audit.json
          if-no-files-found: error
