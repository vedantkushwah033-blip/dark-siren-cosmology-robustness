name: curved-dgp-h0-regression

on:
  pull_request:
    paths:
      - "src/dark_siren_robustness/**"
      - "tests/test_curved_dgp_h0_quadrature_convergence.py"
      - "pyproject.toml"
      - ".github/workflows/curved-dgp-h0-regression.yml"

permissions:
  contents: read

jobs:
  curved-dgp-h0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run curved-inclusion DGP H0 quadrature regression
        run: python -m pytest tests/test_curved_dgp_h0_quadrature_convergence.py -q
