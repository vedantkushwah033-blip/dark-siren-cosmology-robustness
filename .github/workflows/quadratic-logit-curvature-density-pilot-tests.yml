name: Quadratic-logit curvature density pilot tests
on:
  push:
    branches:
      - research/absolute-width-distribution-pilot-20261114
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curvature-density-pilot-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_quadratic_logit_curvature_density_smoke.py tests/test_absolute_bandwidth_density_smoke.py
      - run: pytest -q tests/test_quadratic_logit_curvature_density_pilot.py
