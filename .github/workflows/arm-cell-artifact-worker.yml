name: arm-cell-artifact-worker

on:
  push:
    branches:
      - research/arm-cell-artifact-worker-20261122
      - research/global-arm-cell-coordinator-20261122
      - research/global-coordinator-hard-kill-recovery-v2-20261122
      - research/aggregate-export-audit-hardening-20261122
  pull_request:
    branches:
      - research/arm-cell-execution-foundation-20261121
      - research/arm-cell-artifact-worker-20261122
      - research/global-arm-cell-coordinator-20261122
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  arm-cell-worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test independent arm-cell numerical primitive
        run: python -m pytest tests/test_arm_cell_execution.py -q
      - name: Test inference-free shared-input generator
        run: python -m pytest tests/test_shared_input_generator.py -q
      - name: Test one-cell worker and independent auditor for all five arms
        run: python -m pytest tests/test_arm_cell_worker.py -q
      - name: Test per-cell coordinator, aggregate auditor and lifecycle restart
        run: python -m pytest tests/test_arm_cell_replicate_coordinator.py tests/test_global_arm_cell_coordinator.py tests/test_lifecycle_ledger.py -q
      - name: Validate global arm-cell coordinator and auditor CLIs
        run: |
          python scripts/run_global_arm_cells.py --help
          python scripts/audit_global_arm_cells.py --help
