name: full-parent-event-count-independent-audit

on:
  push:
    branches:
      - research/full-parent-event-count-independent-audit-20261119
    paths:
      - .github/workflows/full-parent-event-count-independent-audit.yml
      - scripts/audit_full_parent_event_count_calibration.py
      - tests/test_full_parent_event_count_independent_audit.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-parent-event-count-independent-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile auditor and run small synthetic regression tests
        run: |
          python -m py_compile scripts/audit_full_parent_event_count_calibration.py
          pytest tests/test_full_parent_event_count_independent_audit.py -q
      - name: Download immutable 500-replicate event-count artifact
        uses: actions/download-artifact@v4
        with:
          name: full-parent-event-count-calibration
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44434616291
          path: artifacts/full_parent_event_count_calibration
      - name: Independently regenerate all 500 parent/event realizations and posterior summaries
        run: |
          python scripts/audit_full_parent_event_count_calibration.py \
            artifacts/full_parent_event_count_calibration \
            --expected-replicates 500 \
            --output artifacts/full_parent_event_count_independent_audit.json
      - name: Upload independent audit report
        uses: actions/upload-artifact@v4
        with:
          name: full-parent-event-count-independent-audit
          path: artifacts/full_parent_event_count_independent_audit.json
          if-no-files-found: error
          retention-days: 90
