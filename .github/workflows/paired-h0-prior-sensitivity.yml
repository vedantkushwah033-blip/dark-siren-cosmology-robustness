name: Paired H0 prior-support sensitivity audit

on:
  pull_request:
    paths:
      - ".github/workflows/paired-h0-prior-sensitivity.yml"
      - "scripts/analyze_paired_h0_prior_sensitivity.py"
      - "scripts/run_quadratic_five_arm_replicates.py"
      - "scripts/audit_quadratic_five_arm_replicates.py"
      - "scripts/analyze_five_arm_weight_error_association.py"
      - "tests/test_five_arm_weight_error_association.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  paired-prior-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade numpy pandas scipy pytest
      - name: Download matched narrow-prior artifact
        uses: actions/download-artifact@v4
        with:
          name: quadratic-five-arm-30event-100rep
          path: artifacts/narrow
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44460222957
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download matched wide-prior artifact
        uses: actions/download-artifact@v4
        with:
          name: quadratic-five-arm-30event-wide-prior-paired-seed-100rep
          path: artifacts/wide
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44484212311
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run paired prior-support audit
        run: |
          python scripts/analyze_paired_h0_prior_sensitivity.py \
            artifacts/narrow artifacts/wide \
            --output-prefix artifacts/paired_prior_sensitivity
      - name: Print complete paired sensitivity table
        run: |
          python - <<'PY'
          import pandas as pd
          p = "artifacts/paired_prior_sensitivity_summary.csv"
          d = pd.read_csv(p)
          pd.set_option("display.max_rows", None)
          pd.set_option("display.max_columns", None)
          pd.set_option("display.width", 220)
          print(d.to_string(index=False, float_format=lambda x: f"{x:.6f}"))
          PY
      - name: Test weight-error association statistics
        run: python -m pytest tests/test_five_arm_weight_error_association.py -q
      - name: Download independent wide-prior seed-2026111940 artifact
        uses: actions/download-artifact@v4
        with:
          name: quadratic-five-arm-30event-wide-prior-100rep
          path: artifacts/wide_independent
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44483923518
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run pooled wide-prior weight-error association screen
        run: |
          python scripts/analyze_five_arm_weight_error_association.py \
            artifacts/wide artifacts/wide_independent \
            --output-prefix artifacts/weight_error_association \
            --bootstrap-resamples 3000
      - name: Upload paired sensitivity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-h0-prior-sensitivity-audit
          path: |
            artifacts/paired_prior_sensitivity.csv
            artifacts/paired_prior_sensitivity_summary.csv
            artifacts/paired_prior_sensitivity.json
          if-no-files-found: warn
