name: degree-matched-30event-h0-grid-refinement

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  exact-grid-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/30event-h0-grid-refinement-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy pytest
      - name: Download frozen 30-event quadrature artifact
        uses: actions/download-artifact@v4
        with:
          name: degree-matched-30event-quadrature-sensitivity
          path: artifacts/source
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44806809662
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run focused audit tests
        run: python -m pytest tests/test_audit_degree_matched_30event_h0_grid.py -q
      - name: Run exact selected-likelihood H0 grid refinement
        run: |
          ZIP="$(find artifacts/source -type f -name '*.zip' -print -quit)"
          if [ -n "$ZIP" ]; then
            python scripts/audit_degree_matched_30event_h0_grid.py --artifact-zip "$ZIP" --output-dir artifacts/h0_grid_refinement
          else
            cd artifacts/source
            zip -qr ../../source-artifact.zip .
            cd ../..
            python scripts/audit_degree_matched_30event_h0_grid.py --artifact-zip source-artifact.zip --output-dir artifacts/h0_grid_refinement
          fi
      - name: Upload exact H0 grid refinement evidence
        uses: actions/upload-artifact@v4
        with:
          name: degree-matched-30event-h0-grid-refinement
          path: artifacts/h0_grid_refinement/
          if-no-files-found: error
