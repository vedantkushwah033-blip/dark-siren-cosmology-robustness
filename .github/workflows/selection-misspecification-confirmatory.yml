name: selection-misspecification-confirmatory

on:
  push:
    branches:
      - research/audit-posterior-grid-integrity
    paths:
      - ".github/selection-confirmatory.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selection-misspecification-confirmatory-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preregistered-stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run locked Stage B confirmation (500 paired replicates)
        run: >-
          python scripts/run_selection_misspecification.py
          --replicates 500
          --n-parent 4000
          --n-detected 30
          --seed 20262030
          --h0-points 81
          --z-points 401
          --output-dir artifacts/selection_misspecification_stage_b
      - name: Independently reconstruct posterior grids and audit the primary estimand
        run: python scripts/audit_selection_misspecification.py artifacts/selection_misspecification_stage_b
      - name: Upload raw data, summary, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: selection-misspecification-stage-b-${{ github.sha }}
          path: artifacts/selection_misspecification_stage_b/
          if-no-files-found: error
          retention-days: 90
