name: Quadratic-curvature H0 calibration pilot

on:
  push:
    branches:
      - research/quadratic-h0-calibration-pilot-implementation-20261119
      - research/quadratic-h0-pilot-fail-closed-audit-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test quadratic H0 calibration pilot orchestration
        run: python -m pytest -q tests/test_quadratic_h0_calibration_pilot.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run paired quadratic-curvature H0 pilot
        run: |
          python scripts/run_quadratic_h0_calibration_pilot.py \
            --replicates 2 \
            --gamma-values 0,1 \
            --validation-sizes 100,300,1000 \
            --output-dir artifacts/quadratic_h0_calibration_pilot
      - name: Independently audit pilot artifact
        run: python scripts/audit_quadratic_h0_calibration_pilot.py --output-dir artifacts/quadratic_h0_calibration_pilot
      - name: Upload paired raw and summary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-h0-calibration-pilot-${{ github.sha }}
          path: artifacts/quadratic_h0_calibration_pilot/
          if-no-files-found: error
          retention-days: 14
