name: Quadratic-curvature H0 calibration pilot

on:
  push:
    branches:
      - research/quadratic-h0-calibration-pilot-implementation-20261119
      - research/quadratic-h0-pilot-fail-closed-audit-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test quadratic H0 calibration pilot orchestration
        run: python -m pytest -q tests/test_quadratic_h0_calibration_pilot.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run paired quadratic-curvature H0 pilot
        run: |
          python scripts/run_quadratic_h0_calibration_pilot.py \
            --replicates 2 \
            --gamma-values 0,1 \
            --validation-sizes 100,300,1000 \
            --output-dir artifacts/quadratic_h0_calibration_pilot
      - name: Independently audit pilot artifact
        if: always()
        run: python scripts/audit_quadratic_h0_calibration_pilot.py --output-dir artifacts/quadratic_h0_calibration_pilot

      - name: Upload paired raw and summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-h0-calibration-pilot-${{ github.sha }}
          path: artifacts/quadratic_h0_calibration_pilot/
          if-no-files-found: warn
          retention-days: 14

  precision-pilot:
    needs: paired-pilot
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-precision]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run 100-replicate fixed-truth H0 precision experiment
        run: |
          python scripts/run_quadratic_h0_calibration_pilot.py \\
            --replicates 100 \\
            --seed 2026111900 \\
            --gamma-values 0,1 \\
            --validation-sizes 100,300,1000 \\
            --output-dir artifacts/quadratic_h0_calibration_precision_100rep
      - name: Independently audit precision artifact
        if: always()
        run: python scripts/audit_quadratic_h0_calibration_pilot.py --output-dir artifacts/quadratic_h0_calibration_precision_100rep
      - name: Upload 100-replicate precision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-h0-calibration-precision-100rep-${{ github.sha }}
          path: artifacts/quadratic_h0_calibration_precision_100rep/
          if-no-files-found: warn
          retention-days: 14

