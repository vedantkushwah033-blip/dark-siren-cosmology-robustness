name: estimated-inclusion-planning

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: "Non-confirmatory planning replicates per DGP scenario (100–250)"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "150"
          - "200"
          - "250"

permissions:
  contents: read

concurrency:
  group: estimated-inclusion-planning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  planning-pilot:
    name: Full-configuration planning pilot (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run correctly specified linear-inclusion planning pilot
        run: |
          python scripts/run_estimated_inclusion_pilot.py \
            --replicates "${{ inputs.replicates }}" \
            --n-parent 4000 \
            --n-detected 30 \
            --validation-sizes 100,300,1000 \
            --seed 20261031 \
            --true-quadratic 0.0 \
            --h0-points 81 \
            --z-points 401 \
            --output-dir artifacts/estimated_inclusion_planning_linear
      - name: Independently audit linear-inclusion artifacts
        run: |
          python scripts/audit_estimated_inclusion_pilot.py artifacts/estimated_inclusion_planning_linear
          python scripts/audit_estimated_inclusion_provenance.py \
            --replicates artifacts/estimated_inclusion_planning_linear/replicates.csv \
            --summary artifacts/estimated_inclusion_planning_linear/summary.json \
            --output artifacts/estimated_inclusion_planning_linear/provenance_audit.json
      - name: Run nonlinear-misspecification planning pilot
        run: |
          python scripts/run_estimated_inclusion_pilot.py \
            --replicates "${{ inputs.replicates }}" \
            --n-parent 4000 \
            --n-detected 30 \
            --validation-sizes 100,300,1000 \
            --seed 20261032 \
            --true-quadratic 1.2 \
            --h0-points 81 \
            --z-points 401 \
            --output-dir artifacts/estimated_inclusion_planning_quadratic
      - name: Independently audit nonlinear-inclusion artifacts
        run: |
          python scripts/audit_estimated_inclusion_pilot.py artifacts/estimated_inclusion_planning_quadratic
          python scripts/audit_estimated_inclusion_provenance.py \
            --replicates artifacts/estimated_inclusion_planning_quadratic/replicates.csv \
            --summary artifacts/estimated_inclusion_planning_quadratic/summary.json \
            --output artifacts/estimated_inclusion_planning_quadratic/provenance_audit.json
      - name: Upload planning artifacts and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: estimated-inclusion-planning-${{ inputs.replicates }}-replicates
          path: artifacts/estimated_inclusion_planning_*/
          if-no-files-found: error
          retention-days: 30
