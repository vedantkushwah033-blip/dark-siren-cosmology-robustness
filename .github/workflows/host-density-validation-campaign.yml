name: host-density-validation-campaign

on:
  push:
    branches:
      - research/audit-posterior-grid-integrity
    paths:
      - "src/dark_siren_robustness/host_density_benchmark.py"
      - "src/dark_siren_robustness/catalogue_density.py"
      - "src/dark_siren_robustness/generative_selection.py"
      - "scripts/run_host_density_benchmark.py"
      - "scripts/analyze_host_density_campaign.py"
      - "scripts/audit_host_density_independent.py"
      - "scripts/diagnose_oracle_bias.py"
      - "scripts/audit_oracle_bias.py"
      - "tests/test_audit_oracle_bias.py"
      - ".github/workflows/host-density-validation-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-density-validation-campaign-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  paired-host-density-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run paired bandwidth, grid, and selection-law sensitivity campaign
        run: python scripts/analyze_host_density_campaign.py --replicates 40 --seed 20261029 --out artifacts/host_density_campaign
      - name: Generate compact independent-audit benchmark
        run: python scripts/run_host_density_benchmark.py --replicates 2 --n-parent 6000 --n-detected 40 --seed 20261029 --h0-points 81 --z-points 401 --output-dir artifacts/host_density_independent_audit
      - name: Re-simulate and independently reconstruct the benchmark
        run: python scripts/audit_host_density_independent.py artifacts/host_density_independent_audit --n-reps 2
      - name: Check campaign manifest hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/host_density_campaign")
          manifest = json.loads((root/"campaign_manifest.json").read_text())
          for name, record in manifest["files"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == record["sha256"], name
          print(f"Verified {len(manifest['files'])} campaign file hashes.")
          PY
      - name: Upload raw campaign tables and independent-audit data
        uses: actions/upload-artifact@v4
        with:
          name: host-density-validation-campaign-${{ github.sha }}
          path: |
            artifacts/host_density_campaign/
            artifacts/host_density_independent_audit/
          if-no-files-found: error
          retention-days: 90

  exact-density-oracle-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Re-run fixed-truth and prior-drawn exact-density oracle calibration
        run: python scripts/diagnose_oracle_bias.py --reps 300 --seed 20261029 --modes 70 60 80 prior --z-points 401 --h0-points 81 --out artifacts/oracle_bias_exact_density.json
      - name: Independently replay exact-density oracle data and reconstruct posteriors
        run: python scripts/audit_oracle_bias.py artifacts/oracle_bias_exact_density.json
      - name: Upload exact-density diagnostic and audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oracle-bias-exact-density-${{ github.sha }}
          path: artifacts/oracle_bias_exact_density*
          if-no-files-found: error
          retention-days: 90
