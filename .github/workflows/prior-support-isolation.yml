name: Prior-support isolation audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_prior_support_isolation.py"
      - "tests/test_prior_support_isolation.py"
      - ".github/workflows/prior-support-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prior-support-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run matched-model prior-support audit
        run: |
          python scripts/run_prior_support_isolation.py \
            --replicates 300 \
            --seed 20261024 \
            --grid-size 3001 \
            --output-dir results/prior-support-isolation
      - name: Validate results
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root = Path("results/prior-support-isolation")
          with (root / "summary.csv").open(newline="") as f:
              summary = list(csv.DictReader(f))
          with (root / "per_run.csv").open(newline="") as f:
              runs = list(csv.DictReader(f))
          if len(summary) != 14 or len(runs) != 4200:
              raise SystemExit(f"Unexpected output sizes: {len(summary)} summary, {len(runs)} run rows")
          if {r["prior"] for r in summary} != {"narrow_50_90", "broad_30_120"}:
              raise SystemExit("Unexpected prior conditions")
          for row in summary:
              for key in ("coverage_68", "coverage_95", "rmse_median", "mean_width_68",
                          "mean_width_95", "boundary_touch_rate_68", "boundary_touch_rate_95"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite metric: {key}")
          print("PASS: 7 truths × 2 priors × 300 replicates = 4,200 posterior fits.")
          PY
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: prior-support-isolation-results
          path: results/prior-support-isolation/
          if-no-files-found: error
          retention-days: 90
