name: Grid refinement numerical convergence audit

on:
  push:
    paths:
      - "scripts/run_grid_refinement_audit.py"
      - "scripts/evaluate_grid_accuracy.py"
      - "tests/test_grid_refinement_audit.py"
      - "tests/test_evaluate_grid_accuracy.py"
      - "tests/test_targeted_grid_refinement.py"
      - "tests/test_grid_accuracy_targeted_integration.py"
      - ".github/workflows/grid-refinement-full.yml"
  workflow_dispatch:
    inputs:
      replicates:
        description: "Matched observations per design cell"
        required: true
        default: "200"
        type: choice
        options: ["100", "200", "300"]
      seed:
        description: "Random seed"
        required: true
        default: "20261101"
        type: string

permissions:
  contents: read

jobs:
  grid-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run grid-refinement tests
        run: python -m pytest tests/test_grid_refinement_audit.py -q
      - name: Execute matched grid audit
        run: |
          python scripts/run_grid_refinement_audit.py \
            --replicates "${{ inputs.replicates || '200' }}" \
            --seed "${{ inputs.seed || '20261101' }}" \
            --output-dir results/grid-refinement-audit-full
      - name: Validate outputs
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root = Path("results/grid-refinement-audit-full")
          n = int("${{ inputs.replicates || '200' }}")
          expected = {"per_run.csv": 3 * 3 * 2 * n * 2 * 3,
                      "summary.csv": 3 * 3 * 2 * 2}
          data = {}
          for name, count in expected.items():
              path = root / name
              with path.open(newline="", encoding="utf-8") as handle:
                  rows = list(csv.DictReader(handle))
              if len(rows) != count:
                  raise SystemExit(f"{name}: expected {count} rows, got {len(rows)}")
              for line, row in enumerate(rows, 2):
                  for key, value in row.items():
                      try:
                          number = float(value)
                      except (ValueError, TypeError):
                          continue
                      if not math.isfinite(number):
                          raise SystemExit(f"{name}:{line}: non-finite {key}")
              data[name] = rows
              print(f"PASS {name}: {len(rows)} rows, numeric values finite")

          fields = ("lower_95", "lower_68", "posterior_median", "upper_68", "upper_95")
          for line, row in enumerate(data["per_run.csv"], 2):
              values = [float(row[key]) for key in fields]
              if values != sorted(values):
                  raise SystemExit(f"per_run.csv:{line}: credible interval endpoints are unordered")

          grouped = {}
          for row in data["per_run.csv"]:
              key = (row["H0_true"], row["z2"], row["noise_fraction"],
                     row["replicate"], row["inference_weighting"])
              grouped.setdefault(key, {})[int(row["grid_size"])] = row
          for key, grids in grouped.items():
              if set(grids) != {1001, 2001, 4001}:
                  raise SystemExit(f"Incomplete grid resolutions for {key}")

          observations = {}
          for row in data["per_run.csv"]:
              key = (row["H0_true"], row["z2"], row["noise_fraction"], row["replicate"])
              observations.setdefault(key, set()).add(row["observed_distance_mpc"])
          if any(len(values) != 1 for values in observations.values()):
              raise SystemExit("Simulated observations changed across weighting/grid conditions")

          summary_metrics = (
              "median_abs_median_diff_1001_vs_4001",
              "abs_lower68_diff_1001_vs_4001", "abs_upper68_diff_1001_vs_4001",
              "abs_lower95_diff_1001_vs_4001", "abs_upper95_diff_1001_vs_4001",
              "median_abs_median_diff_2001_vs_4001",
          )
          for line, row in enumerate(data["summary.csv"], 2):
              for metric in summary_metrics:
                  median = float(row[f"median_{metric}"])
                  p95 = float(row[f"p95_{metric}"])
                  maximum = float(row[f"max_{metric}"])
                  if not (0 <= median <= p95 <= maximum):
                      raise SystemExit(f"summary.csv:{line}: inconsistent order for {metric}")
          print("PASS: interval ordering, matched observations, complete grid triplets, and summary quantiles.")
          PY
      - name: Evaluate results against prospective accuracy criteria
        run: |
          python scripts/evaluate_grid_accuracy.py \
            --per-run results/grid-refinement-audit-full/per_run.csv \
            --output-dir results/grid-refinement-audit-full/accuracy-assessment
      - name: Refine flagged cases on higher-resolution grids
        run: |
          python scripts/run_targeted_grid_refinement.py \
            --flagged-cases results/grid-refinement-audit-full/accuracy-assessment/case_accuracy_assessment.csv \
            --per-run results/grid-refinement-audit-full/per_run.csv \
            --output results/grid-refinement-audit-full/targeted_refinement.csv
      - name: Finalize assessment with targeted results
        run: |
          python scripts/evaluate_grid_accuracy.py \
            --per-run results/grid-refinement-audit-full/per_run.csv \
            --targeted-refinement results/grid-refinement-audit-full/targeted_refinement.csv \
            --output-dir results/grid-refinement-audit-full/accuracy-assessment
      - name: Upload convergence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grid-refinement-r${{ inputs.replicates || '200' }}-seed${{ inputs.seed || '20261101' }}
          path: results/grid-refinement-audit-full/**
          if-no-files-found: error
          retention-days: 90
