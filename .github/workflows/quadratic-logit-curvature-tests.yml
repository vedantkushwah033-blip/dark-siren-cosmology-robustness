name: quadratic-logit-curvature-tests

on:
  push:
    branches:
      - research/absolute-width-distribution-pilot-20261114
    paths:
      - src/dark_siren_robustness/generative_selection.py
      - tests/test_absolute_bandwidth_density_smoke.py
      - .github/workflows/quadratic-logit-curvature-tests.yml
  workflow_dispatch:

concurrency:
  group: quadratic-logit-curvature-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-curvature-dgp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test quadratic-logit DGP, inclusion posterior and density auditor regressions
        run: python -m pytest tests/test_absolute_bandwidth_density_smoke.py tests/test_inclusion_posterior.py -q
