name: Baseline calibration reproduction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calibration-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out robustness repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib pytest

      - name: Fetch pinned original simulator
        run: |
          git clone https://github.com/vedantkushwah033-blip/bayesian-dark-siren-cosmology.git original-project
          git -C original-project checkout b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f
          python -m pip install -r original-project/requirements.txt

      - name: Reproduce 1000-run baseline controls
        run: |
          python scripts/reproduce_original_coverage.py --original-dir original-project --replicates 1000 --seed 2026 --output-dir results/original-audit

      - name: Calculate multi-level coverage curve
        run: |
          python scripts/run_coverage_curve.py --original-dir original-project --replicates 1000 --seed 2026 --output results/original-audit/coverage_curve.csv

      - name: Validate calibration outputs
        run: python scripts/validate_calibration_artifacts.py results/original-audit

      - name: Upload baseline calibration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline-calibration-1000
          path: results/original-audit/
          if-no-files-found: error
          retention-days: 30
