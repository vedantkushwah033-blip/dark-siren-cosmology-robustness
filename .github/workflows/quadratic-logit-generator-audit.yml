name: quadratic-logit-generator-audit

on:
  push:
    branches:
      - research/quadratic-logit-generator-audit-20261119
    paths:
      - .github/workflows/quadratic-logit-generator-audit.yml
      - src/dark_siren_robustness/generative_selection.py
      - tests/test_quadratic_logit_generator_audit.py
  pull_request:
    paths:
      - .github/workflows/quadratic-logit-generator-audit.yml
      - src/dark_siren_robustness/generative_selection.py
      - tests/test_quadratic_logit_generator_audit.py

permissions:
  contents: read

concurrency:
  group: quadratic-logit-generator-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  generator-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test quadratic-logit inclusion calibration and truth separation
        run: python -m pytest tests/test_quadratic_logit_generator_audit.py -q
