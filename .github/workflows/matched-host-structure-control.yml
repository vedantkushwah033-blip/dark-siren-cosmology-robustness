name: Matched host-structure misspecification control

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_matched_host_structure_control.py"
      - "tests/test_matched_host_structure_control.py"
      - ".github/workflows/matched-host-structure-control.yml"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "src/dark_siren_robustness/selection.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused tests
        run: python -m pytest tests/test_matched_host_structure_control.py -q
      - name: Run matched control
        run: python scripts/run_matched_host_structure_control.py --replicates 300 --seed 20261031 --grid-size 4001 --bootstrap-draws 5000 --output-dir results/matched-host-structure-control
      - name: Validate output dimensions and numerical values
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results/matched-host-structure-control")
          with (root / "per_run.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          with (root / "summary.csv").open(newline="") as f:
              summaries = list(csv.DictReader(f))
          manifest = json.loads((root / "experiment_manifest.json").read_text())
          if len(rows) != 2700 or len(summaries) != 54:
              raise SystemExit(f"Unexpected output sizes: {len(rows)} raw, {len(summaries)} summaries")
          if manifest["raw_rows"] != len(rows) or manifest["summary_rows"] != len(summaries):
              raise SystemExit("Manifest row counts do not match CSV outputs")
          for row in rows:
              if not 0 < float(row["observed_distance_mpc"]) < 120:
                  raise SystemExit("Observation outside true detection interval")
              for method in manifest["methods"]:
                  for key in ("median", "lower_68", "upper_68", "lower_95", "upper_95", "error"):
                      if not math.isfinite(float(row[f"{method}_{key}"])):
                          raise SystemExit(f"Non-finite value: {method}_{key}")
          for row in summaries:
              for key in ("bias", "mae", "rmse", "coverage_68", "coverage_95", "mean_paired_change", "bootstrap_95_low", "bootstrap_95_high"):
                  if row.get(key, "") != "" and not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite summary value: {key}")
          print("PASS: 2,700 paired observations, 54 summaries, and manifest validated.")
          PY
      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: matched-host-structure-control-results
          path: results/matched-host-structure-control/
          if-no-files-found: error
          retention-days: 90
