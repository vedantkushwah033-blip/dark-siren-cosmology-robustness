name: exact-geometric-prior-predictive-h0-grid-audit

on:
  push:
    branches:
      - research/five-arm-prior-predictive-20rep-20261120
    paths:
      - ".github/workflows/exact-geometric-prior-predictive-h0-grid-audit.yml"
      - "docs/geometric_h0_grid_refinement_20rep_audit_2026-11-20.md"
      - "scripts/audit_geometric_prior_predictive_h0_grid.py"
      - "tests/test_audit_geometric_prior_predictive_h0_grid.py"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed geometric prior-predictive experiment workflow run ID
        required: true
        default: "44731915717"
      replicates:
        description: Number of frozen prior-predictive replicates in source artifact
        required: true
        default: "20"

permissions:
  actions: read
  contents: read

jobs:
  exact-grid-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test exact-grid auditor primitives before downloading large artifact
        run: |
          python -m py_compile scripts/audit_geometric_prior_predictive_h0_grid.py
          python -m pytest -q tests/test_audit_geometric_prior_predictive_h0_grid.py
      - name: Download frozen prior-predictive experiment artifact
        uses: actions/download-artifact@v4
        with:
          name: geometric-h0-prior-predictive-20rep
          run-id: ${{ inputs.source_run_id || '44731915717' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact
      - name: Repack exact frozen source artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("source-artifact")
          candidates = list(root.glob("geometric_prior_predictive_20rep"))
          if len(candidates) != 1 or not candidates[0].is_dir():
              raise SystemExit(f"expected experiment root folder; found {candidates}")
          with zipfile.ZipFile("geometric-prior-predictive-source.zip", "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in candidates[0].rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY
      - name: Recompute selected likelihoods on 2,241-point geometric grid
        run: |
          python scripts/audit_geometric_prior_predictive_h0_grid.py \
            --artifact-zip geometric-prior-predictive-source.zip \
            --replicates ${{ inputs.replicates || '20' }} \
            --source-points 1121 \
            --fine-points 2241 \
            --output-dir results/geometric-h0-grid-audit
      - name: Enforce complete curve coverage and convergence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/geometric-h0-grid-audit/geometric_h0_grid_refinement_summary.json").read_text())
          expected = int("${{ inputs.replicates || '20' }}") * 3 * 3 * 5
          assert report["status"] == "PASS"
          assert report["rows"] == expected
          assert report["grid_type"] == "geometric"
          assert report["integration_measure"] == "dH0"
          PY
      - name: Upload exact-grid audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-geometric-prior-predictive-h0-grid-audit
          path: results/geometric-h0-grid-audit/
          if-no-files-found: error
