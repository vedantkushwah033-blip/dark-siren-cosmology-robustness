name: h0-oracle-diagnostic-tests

on:
  push:
    branches:
      - research/h0-100rep-calibration-precision-20261119
    paths:
      - .github/workflows/h0-oracle-diagnostic-tests.yml
      - scripts/audit_h0_known_inclusion_oracle_sensitivity.py
      - tests/test_h0_known_inclusion_oracle_sensitivity.py
  workflow_dispatch:

jobs:
  oracle-diagnostic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile independent oracle auditor
        run: python -m py_compile scripts/audit_h0_known_inclusion_oracle_sensitivity.py
      - name: Run independent oracle likelihood regression tests
        run: pytest tests/test_h0_known_inclusion_oracle_sensitivity.py -q
