name: full-parent-h0-cluster-uncertainty-tests
# Replays the archived full-parent baseline with manifest-verified cluster inference

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - research/full-parent-baseline-cluster-uncertainty-20261119
    paths:
      - .github/workflows/full-parent-h0-cluster-uncertainty-tests.yml
      - scripts/analyze_full_parent_h0_cluster_uncertainty.py
      - tests/test_full_parent_h0_cluster_uncertainty.py
  workflow_dispatch:

jobs:
  cluster-uncertainty-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile cluster uncertainty analysis
        run: python -m py_compile scripts/analyze_full_parent_h0_cluster_uncertainty.py
      - name: Test parent-cluster uncertainty
        run: pytest tests/test_full_parent_h0_cluster_uncertainty.py -q
      - name: Download full-parent 2,000-event baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: full-parent-fixed-count-h0-baseline-2000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44417807075
          path: artifacts/full_parent_baseline
      - name: Compute parent-cluster uncertainty
        run: |
          python scripts/analyze_full_parent_h0_cluster_uncertainty.py \
            artifacts/full_parent_baseline \
            --output-dir artifacts/full_parent_cluster_uncertainty
      - name: Upload cluster-aware readout
        uses: actions/upload-artifact@v4
        with:
          name: full-parent-h0-cluster-uncertainty
          path: artifacts/full_parent_cluster_uncertainty/
          if-no-files-found: error
          retention-days: 90
