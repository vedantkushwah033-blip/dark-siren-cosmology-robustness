name: Cosmological model robustness

on:
  push:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/cosmology.py"
      - "src/dark_siren_robustness/cosmological_inference.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_cosmological_model_robustness.py"
      - "tests/test_cosmological_inference.py"
      - ".github/workflows/cosmological-model-robustness.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/cosmology.py"
      - "src/dark_siren_robustness/cosmological_inference.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_cosmological_model_robustness.py"
      - "tests/test_cosmological_inference.py"
      - ".github/workflows/cosmological-model-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run cosmology and inference tests
        run: python -m pytest -q tests/test_cosmology.py tests/test_cosmology_convergence.py tests/test_cosmological_inference.py
      - name: Run paired model-robustness experiment
        run: python scripts/run_cosmological_model_robustness.py --output-dir results/cosmological-model-robustness --replicates 200 --seed 20261024 --grid-size 2001
      - name: Validate experiment artifacts
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results/cosmological-model-robustness")
          manifest = json.loads((root / "experiment_manifest.json").read_text())
          with (root / "per_run.csv").open(newline="") as f:
              raw = list(csv.DictReader(f))
          with (root / "summary.csv").open(newline="") as f:
              summary = list(csv.DictReader(f))
          assert len(raw) == manifest["raw_rows"] == 7200, len(raw)
          assert len(summary) == manifest["summary_rows"] == 36, len(summary)
          assert {r["inference_model"] for r in raw} == {"matched_flat_lcdm", "mismatched_low_z"}
          assert all(math.isfinite(float(r["posterior_median_H0"])) for r in raw)
          assert all(40 <= float(r["posterior_median_H0"]) <= 100 for r in raw)
          assert all(math.isfinite(float(r["mae_H0"])) for r in summary)
          print("Artifact schema, row counts, model labels, finite values, and prior support: PASS")
          PY
      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: cosmological-model-robustness-results
          path: results/cosmological-model-robustness/
          if-no-files-found: error
          retention-days: 90
