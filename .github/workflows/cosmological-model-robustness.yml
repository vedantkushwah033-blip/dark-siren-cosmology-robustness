name: Cosmological model robustness

on:
  push:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/cosmology.py"
      - "src/dark_siren_robustness/cosmological_inference.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_cosmological_model_robustness.py"
      - "tests/test_cosmological_inference.py"
      - ".github/workflows/cosmological-model-robustness.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/cosmology.py"
      - "src/dark_siren_robustness/cosmological_inference.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_cosmological_model_robustness.py"
      - "tests/test_cosmological_inference.py"
      - ".github/workflows/cosmological-model-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run cosmology and inference tests
        run: python -m pytest -q tests/test_cosmology.py tests/test_cosmology_convergence.py tests/test_cosmological_inference.py
      - name: Run paired model-robustness experiment
        run: python scripts/run_cosmological_model_robustness.py --output-dir results/cosmological-model-robustness --replicates 200 --seed 20261024 --grid-size 2001
      - name: Validate experiment artifacts
        run: |
          python - <<'PY'
          import csv, json, math
          from collections import defaultdict
          from pathlib import Path
          import numpy as np
          root = Path("results/cosmological-model-robustness")
          manifest = json.loads((root / "experiment_manifest.json").read_text())
          with (root / "per_run.csv").open(newline="") as f:
              raw = list(csv.DictReader(f))
          with (root / "summary.csv").open(newline="") as f:
              summary = list(csv.DictReader(f))
          with (root / "paired_contrasts.csv").open(newline="") as f:
              contrasts = list(csv.DictReader(f))
          assert len(raw) == manifest["raw_rows"] == 7200, len(raw)
          assert len(summary) == manifest["summary_rows"] == 36, len(summary)
          assert len(contrasts) == manifest["paired_contrast_rows"] == 18, len(contrasts)
          assert {r["inference_model"] for r in raw} == {"matched_flat_lcdm", "mismatched_low_z"}
          assert all(math.isfinite(float(r["posterior_median_H0"])) for r in raw)
          assert all(40 <= float(r["posterior_median_H0"]) <= 100 for r in raw)
          paired = defaultdict(dict)
          groups = defaultdict(list)
          for row in raw:
              key = (float(row["true_H0"]), float(row["redshift"]), int(row["replicate"]))
              paired[key][row["inference_model"]] = float(row["observed_distance_mpc"])
              groups[(float(row["true_H0"]), float(row["redshift"]), row["inference_model"])].append(row)
          assert all(set(v) == {"matched_flat_lcdm", "mismatched_low_z"} for v in paired.values())
          assert all(abs(v["matched_flat_lcdm"] - v["mismatched_low_z"]) < 1e-12 for v in paired.values())
          for s in summary:
              key = (float(s["true_H0"]), float(s["redshift"]), s["inference_model"])
              rows = groups[key]
              e = np.array([float(r["error_H0"]) for r in rows])
              expected = {
                  "bias_H0": float(np.mean(e)),
                  "mae_H0": float(np.mean(np.abs(e))),
                  "rmse_H0": float(np.sqrt(np.mean(e**2))),
                  "coverage_68": float(np.mean([int(r["covered_68"]) for r in rows])),
                  "coverage_95": float(np.mean([int(r["covered_95"]) for r in rows])),
                  "mean_width_68": float(np.mean([float(r["width_68"]) for r in rows])),
                  "mean_width_95": float(np.mean([float(r["width_95"]) for r in rows])),
              }
              for metric, value in expected.items():
                  assert math.isclose(float(s[metric]), value, rel_tol=1e-10, abs_tol=1e-10), (key, metric, s[metric], value)
          assert all(int(r["n_pairs"]) == 200 for r in contrasts)
          assert all(float(r["bootstrap_95_low"]) <= float(r["mean_delta_absolute_error_mismatch_minus_matched"]) <= float(r["bootstrap_95_high"]) or math.isfinite(float(r["mean_delta_absolute_error_mismatch_minus_matched"])) for r in contrasts)
          assert all(float(r["bootstrap_95_low"]) <= float(r["bootstrap_95_high"]) for r in contrasts)
          print("Raw rows, paired observations, summaries, paired bootstrap contrasts, finite values, and prior support: PASS")
          PY
      - name: Upload reproducible results
        uses: actions/upload-artifact@v4
        with:
          name: cosmological-model-robustness-results
          path: results/cosmological-model-robustness/
          if-no-files-found: error
          retention-days: 90
