name: Full-parent event-count H0 grid refinement audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-parent-event-count-grid-audit
  cancel-in-progress: false

jobs:
  grid-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile and test independent posterior reconstruction
        run: |
          python -m py_compile scripts/audit_full_parent_event_count_grid_refinement.py
          pytest -q tests/test_full_parent_event_count_grid_refinement.py
      - name: Download immutable 500-replicate source artifact
        uses: actions/download-artifact@v4
        with:
          name: full-parent-event-count-calibration
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44434616291
          path: artifacts/full_parent_event_count_calibration
      - name: Independently reconstruct 561-grid and compare with 1121-grid on 50 paired replicates
        run: |
          python scripts/audit_full_parent_event_count_grid_refinement.py \
            artifacts/full_parent_event_count_calibration \
            --sample-size 50 \
            --fine-points 1121 \
            --max-quantile-shift 0.05 \
            --max-density-l1 0.001 \
            --output artifacts/full_parent_event_count_grid_audit.json
      - name: Upload grid-refinement audit report
        uses: actions/upload-artifact@v4
        with:
          name: full-parent-event-count-grid-refinement-audit
          path: artifacts/full_parent_event_count_grid_audit.json
          if-no-files-found: error
          retention-days: 90
