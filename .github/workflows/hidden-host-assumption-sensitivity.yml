name: Hidden-host assumption sensitivity

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/run_hidden_host_assumption_sensitivity.py"
      - "scripts/audit_hidden_host_assumption_sensitivity.py"
      - "tests/test_hidden_host_assumption_sensitivity.py"
      - "docs/hidden_host_assumption_sensitivity_protocol.md"
      - ".github/workflows/hidden-host-assumption-sensitivity.yml"
  pull_request:
    paths:
      - "scripts/run_hidden_host_assumption_sensitivity.py"
      - "scripts/audit_hidden_host_assumption_sensitivity.py"
      - "tests/test_hidden_host_assumption_sensitivity.py"
      - "docs/hidden_host_assumption_sensitivity_protocol.md"
      - ".github/workflows/hidden-host-assumption-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hidden-host-assumptions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused and adversarial tests
        run: python -m pytest tests/test_hidden_host_assumption_sensitivity.py -q
      - name: Run paired hidden-host assumption factorial
        run: |
          python scripts/run_hidden_host_assumption_sensitivity.py \
            --replicates 200 \
            --seed 20261032 \
            --bootstrap-resamples 1000 \
            --output-dir results/hidden-host-assumption-sensitivity
      - name: Validate design shape, pairing, finite metrics, and intervals
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root = Path("results/hidden-host-assumption-sensitivity")
          def read(name):
              with (root / name).open(newline="", encoding="utf-8") as f:
                  return list(csv.DictReader(f))
          raw, summaries, contrasts = read("per_run.csv"), read("summary.csv"), read("paired_contrasts.csv")
          if (len(raw),len(summaries),len(contrasts)) != (105600,528,2880):
              raise SystemExit(f"Unexpected output sizes: {len(raw)}, {len(summaries)}, {len(contrasts)}")
          expected_arms = ["base_omitted","oracle_hidden"] + [
              f"assumed_f{f:.3f}_z{z:.3f}" for f in (0.15,0.30,0.45) for z in (0.025,0.030,0.035)
          ]
          for start in range(0,len(raw),len(expected_arms)):
              block=raw[start:start+len(expected_arms)]
              if [r["inference_arm"] for r in block] != expected_arms:
                  raise SystemExit(f"Arm order mismatch near raw row {start}")
              if len({r["observed_distance_mpc"] for r in block}) != 1:
                  raise SystemExit(f"Unpaired observation near raw row {start}")
          for rows in (raw,summaries,contrasts):
              for row in rows:
                  for key,value in row.items():
                      if key in ("inference_arm","contrast","left_arm","right_arm","metric"):
                          continue
                      if not math.isfinite(float(value)):
                          raise SystemExit(f"Non-finite {key}: {value}")
          if any(float(r["ci95_low"]) > float(r["ci95_high"]) for r in contrasts):
              raise SystemExit("Reversed bootstrap interval")
          print("PASS: 48 cells × 200 observations × 11 arms = 105,600 posterior fits.")
          PY
      - name: Independently reconstruct seeded observations, posteriors, summaries, and contrasts
        run: |
          python scripts/audit_hidden_host_assumption_sensitivity.py \
            --replicates 200 \
            --seed 20261032 \
            --bootstrap-resamples 1000 \
            --input-dir results/hidden-host-assumption-sensitivity
      - name: Upload full assumption-sensitivity outputs
        uses: actions/upload-artifact@v4
        with:
          name: hidden-host-assumption-sensitivity
          path: results/hidden-host-assumption-sensitivity/
          if-no-files-found: error
          retention-days: 90
