name: Prior interval-width sensitivity audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_prior_interval_width_sensitivity.py"
      - "scripts/run_prior_support_sensitivity.py"
      - "scripts/run_fixed_truth_coverage_map.py"
      - "tests/test_prior_interval_width_sensitivity.py"
      - ".github/workflows/prior-interval-width-sensitivity.yml"
      - "src/dark_siren_robustness/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interval-width:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run interval-width audit
        run: python scripts/run_prior_interval_width_sensitivity.py --replicates 300 --seed 20261024 --grid-size 4001 --output-dir results/prior-interval-width
      - name: Run focused tests
        run: python -m pytest tests/test_prior_interval_width_sensitivity.py -q
      - name: Upload validated CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prior-interval-width-python-${{ matrix.python-version }}
          path: results/prior-interval-width/*.csv
          if-no-files-found: error
          retention-days: 90
