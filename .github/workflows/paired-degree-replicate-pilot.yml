name: paired-degree-replicate-pilot

on:
  push:
    branches:
      - research/paired-degree-replicate-pilot-20261121
    paths:
      - .github/workflows/paired-degree-replicate-pilot.yml
      - scripts/run_paired_degree_multireplicate_pilot.py
      - scripts/audit_paired_degree_multireplicate_pilot.py
      - scripts/run_quadratic_five_arm_replicates.py
      - scripts/audit_quadratic_five_arm_replicates.py
      - scripts/run_quadratic_five_arm_smoke.py
      - scripts/audit_quadratic_five_arm_smoke.py
      - tests/test_paired_degree_multireplicate_pilot.py
  pull_request:
    branches:
      - research/30event-h0-grid-refinement-20261121
    paths:
      - .github/workflows/paired-degree-replicate-pilot.yml
      - scripts/run_paired_degree_multireplicate_pilot.py
      - scripts/audit_paired_degree_multireplicate_pilot.py
      - scripts/run_quadratic_five_arm_replicates.py
      - scripts/audit_quadratic_five_arm_replicates.py
      - scripts/run_quadratic_five_arm_smoke.py
      - scripts/audit_quadratic_five_arm_smoke.py
      - tests/test_paired_degree_multireplicate_pilot.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paired-degree-replicate-pilot
  cancel-in-progress: false

jobs:
  paired-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/paired-degree-replicate-pilot-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test paired-degree runner and independent auditor
        run: python -m pytest tests/test_paired_degree_multireplicate_pilot.py -q
      - name: Run four-replicate paired degree-one/degree-two five-arm pilot
        run: |
          python scripts/run_paired_degree_multireplicate_pilot.py \
            --master-seed 2026112111 --replicates 4 --gammas=-1,0,1 \
            --n-parent 1200 --n-detected 30 --validation-frame 500 \
            --validation-sizes 100,300,500 --curvature-beta -3.9 \
            --h0-true 70 --h0-prior-min 50 --h0-prior-max 90 \
            --h0-points 281 --scott-multiplier 0.7 --quadrature-order 5 \
            --sigma-mpc 140 --detection-threshold-mpc 250 \
            --output-dir artifacts/paired_degree_replicates
      - name: Independently audit paired pilot artifacts
        run: |
          python scripts/audit_paired_degree_multireplicate_pilot.py \
            artifacts/paired_degree_replicates \
            --output artifacts/paired_degree_replicates/independent_audit.json
      - name: Assert complete lifecycle and paired design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/paired_degree_replicates")
          cfg = json.loads((root / "config.json").read_text())
          audit = json.loads((root / "independent_audit.json").read_text())
          assert cfg["status"] == "PASS", cfg["status"]
          assert audit["status"] == "PASS", audit["status"]
          assert cfg["replicates"] == 4
          assert cfg["gammas"] == [-1.0, 0.0, 1.0]
          assert cfg["n_parent"] == 1200 and cfg["n_detected"] == 30
          assert audit["planned_cells"] == 4 * 3 * 3 * 5
          assert audit["successful_child_runs"] == 4 * 3 * 2
          assert audit["paired_contrast_rows_reconstructed"] == 4 * 3 * 3 * 4
          print(json.dumps({"status":"PASS","planned_cells":audit["planned_cells"],
                            "successful_child_runs":audit["successful_child_runs"],
                            "paired_contrast_rows":audit["paired_contrast_rows_reconstructed"]},
                           indent=2))
          PY
      - name: Upload paired degree pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: paired-degree-30event-four-replicate-pilot
          path: artifacts/paired_degree_replicates/
          if-no-files-found: error
          retention-days: 90
