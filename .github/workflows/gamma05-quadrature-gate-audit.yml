name: gamma05-full-support-quadrature-gate-audit

on:
  push:
    branches:
      - research/gamma05-quadrature-gate-audit-20261118

permissions:
  contents: read
  actions: read

jobs:
  gamma05-quadrature-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download independently audited gamma=0.5 density artifact
        uses: actions/download-artifact@v4
        with:
          name: corrected-gamma05-20rep-density-pilot-46ad562fbc03cae28c51f8373a3ab93b70431e46
          run-id: 44366794840
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/gamma05
      - name: Verify downloaded source artifact manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/gamma05")
          manifest = json.loads((root / "manifest.json").read_text())
          checked = 0
          for rel, meta in manifest["files"].items():
              path = root / rel
              assert path.is_file(), rel
              assert path.stat().st_size == int(meta["bytes"]), rel
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == meta["sha256"], rel
              checked += 1
          assert checked == int(manifest["file_count"])
          print(f"Verified {checked} source-artifact files.")
          PY
      - name: Run full-support inclusion quadrature and host-weight stability gate
        run: |
          python scripts/audit_inclusion_quadrature_ladder.py \
            artifacts/gamma05 \
            --output artifacts/gamma05_quadrature_gate.json \
            --orders 5,7,9,11,13 \
            --full-support-points 401 \
            --mean-tolerance 0.001 \
            --covariance-tolerance 0.001 \
            --predictive-tolerance 0.001 \
            --log-evidence-tolerance 0.001 \
            --mixture-max-abs-tolerance 0.001 \
            --mixture-total-variation-tolerance 0.005 \
            --consecutive-passes 2 \
            --require-convergence
      - name: Preserve quadrature gate report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma05-full-support-quadrature-gate
          path: |
            artifacts/gamma05_quadrature_gate.json
            artifacts/gamma05_quadrature_gate.csv
          if-no-files-found: warn
          retention-days: 30
