name: original-coverage-seed-sensitivity

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: "Replicates per seed (1000 recommended; use 5000 for higher precision)"
        required: true
        default: "1000"
        type: string

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: ["2026", "31027"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone original project at audited commit
        run: |
          git clone https://github.com/vedantkushwah033-blip/bayesian-dark-siren-cosmology.git original-project
          cd original-project
          git checkout b9277e7bf9ad5e053c40c1c671b70aa7f3d0708f
      - name: Install original project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r original-project/requirements.txt
      - name: Reproduce baseline controls
        run: |
          python scripts/reproduce_original_coverage.py \
            --original-dir original-project \
            --replicates "${{ inputs.replicates }}" \
            --seed "${{ matrix.seed }}"
      - name: Calculate multi-level coverage curve
        run: |
          python scripts/run_coverage_curve.py \
            --original-dir original-project \
            --replicates "${{ inputs.replicates }}" \
            --seed "${{ matrix.seed }}"
      - name: Validate generated artifacts
        run: python scripts/validate_calibration_artifacts.py results/original-audit
      - name: Upload results for this seed
        uses: actions/upload-artifact@v4
        with:
          name: original-coverage-seed-${{ matrix.seed }}
          path: results/original-audit/
          if-no-files-found: error
