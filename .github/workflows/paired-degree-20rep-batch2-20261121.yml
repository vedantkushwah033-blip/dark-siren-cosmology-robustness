name: paired-degree-20rep-batch2-20261121

on:
  push:
    branches:
      - research/paired-degree-20rep-batch2-20261121
    paths:
      - .github/workflows/paired-degree-20rep-batch2-20261121.yml
      - scripts/run_paired_degree_multireplicate_pilot.py
      - scripts/audit_paired_degree_multireplicate_pilot.py
      - scripts/run_quadratic_five_arm_replicates.py
      - scripts/audit_quadratic_five_arm_replicates.py
      - scripts/run_quadratic_five_arm_smoke.py
      - scripts/audit_quadratic_five_arm_smoke.py
      - scripts/audit_degree_prior_parameterization.py
      - tests/test_paired_degree_multireplicate_pilot.py
  workflow_dispatch:

concurrency:
  group: paired-degree-20rep-batch2-20261121
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  paired-degree-batch2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/paired-degree-20rep-batch2-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Audit matched degree-one/degree-two centered-basis priors
        run: python scripts/audit_degree_prior_parameterization.py
      - name: Test paired-degree orchestration and invariance gates
        run: python -m pytest tests/test_paired_degree_multireplicate_pilot.py tests/test_quadratic_five_arm_replicates.py -q
      - name: Run independent 20-replicate paired degree-one/degree-two batch
        run: |
          python scripts/run_paired_degree_multireplicate_pilot.py \
            --master-seed 2026112121 --replicates 20 --gammas=-1,0,1 \
            --n-parent 1200 --n-detected 30 --validation-frame 500 \
            --validation-sizes 100,500 --h0-true 70 \
            --h0-prior-min 30 --h0-prior-max 110 --h0-points 281 \
            --quadrature-order 5 \
            --output-dir artifacts/paired_degree_multireplicate_batch2
      - name: Independently audit paired-degree batch artifact
        if: success()
        run: |
          python scripts/audit_paired_degree_multireplicate_pilot.py \
            artifacts/paired_degree_multireplicate_batch2 \
            --output artifacts/paired_degree_multireplicate_batch2/independent_audit_report.json
      - name: Upload paired-degree batch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-degree-20rep-batch2-20261121
          path: artifacts/paired_degree_multireplicate_batch2/
          if-no-files-found: warn
