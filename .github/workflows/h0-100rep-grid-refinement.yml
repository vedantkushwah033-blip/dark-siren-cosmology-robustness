name: h0-100rep-grid-refinement

on:
  push:
    branches:
      - research/h0-100rep-grid-refinement-20261119
    paths:
      - .github/workflows/h0-100rep-grid-refinement.yml
      - scripts/run_h0_100rep_grid_refinement.py
      - tests/test_h0_100rep_grid_refinement.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: h0-100rep-grid-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-grid-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile and test grid-refinement diagnostics
        run: |
          python -m py_compile scripts/run_h0_100rep_grid_refinement.py
          pytest tests/test_h0_100rep_grid_refinement.py -q
      - name: Download immutable first 100-replicate calibration artifact
        uses: actions/download-artifact@v4
        with:
          name: h0-100rep-calibration-precision-py3.12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44411667480
          path: artifacts/h0_100rep_baseline
      - name: Rerun first three paired replicates at 281, 561 and 1,121 H0 points
        run: |
          python scripts/run_h0_100rep_grid_refinement.py \
            --baseline-dir artifacts/h0_100rep_baseline \
            --output-dir artifacts/h0_100rep_grid_refinement \
            --replicates 3 \
            --grid-points 281,561,1121
      - name: Require complete refined reruns and retain numerical outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("artifacts/h0_100rep_grid_refinement/grid_refinement_report.json").read_text())
          assert report["status"] == "PASS", report
          assert report["baseline_planned_cells_in_subset"] == 18, report
          assert report["baseline_non_evaluable_cells_in_subset"] == 1, report
          assert report["baseline_successful_cells_selected"] == 17, report
          assert report["planned_refined_runs"] == 51, report
          assert report["successful_refined_runs"] == 51, report
          assert report["failed_refined_runs"] == 0, report
          assert report["comparison_rows"] == 85, report
          print(json.dumps(report, indent=2))
          PY
      - name: Upload paired grid-refinement artifact
        uses: actions/upload-artifact@v4
        with:
          name: h0-100rep-grid-refinement-281-561-1121
          path: artifacts/h0_100rep_grid_refinement/
          if-no-files-found: error
          retention-days: 90
