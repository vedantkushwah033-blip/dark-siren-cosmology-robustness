name: quadratic-logit-h0-calibration-pilot

on:
  push:
    branches:
      - research/quadratic-logit-h0-calibration-pilot-20261119
    paths:
      - .github/workflows/quadratic-logit-h0-calibration-pilot.yml
      - scripts/run_quadratic_logit_h0_calibration_pilot.py
      - scripts/audit_quadratic_logit_h0_calibration_pilot.py
      - scripts/run_quadratic_logit_inclusion_h0_smoke.py
      - scripts/audit_quadratic_logit_inclusion_h0_smoke.py
      - src/dark_siren_robustness/**
      - .github/workflows/quadratic-logit-h0-calibration-pilot.yml
      - scripts/run_quadratic_logit_h0_calibration_pilot.py
      - scripts/audit_quadratic_logit_h0_calibration_pilot.py
      - scripts/run_quadratic_logit_inclusion_h0_smoke.py
      - scripts/audit_quadratic_logit_inclusion_h0_smoke.py
      - src/dark_siren_robustness/**
  workflow_dispatch:

concurrency:
  group: quadratic-logit-h0-calibration-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-fixed-truth-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run paired 10-replicate gamma by validation-size H0 pilot
        run: |
          python scripts/run_quadratic_logit_h0_calibration_pilot.py \
            --replicates 10 \
            --seed 2026111905 \
            --gammas=-1,0,1 \
            --validation-sizes 100,300,500 \
            --n-validation-frame 500 \
            --n-parent 1200 \
            --n-detected 4 \
            --h0-true 70 \
            --h0-points 141 \
            --prior-min 20 \
            --prior-max 300 \
            --orders 3,5,7,9 \
            --density-tolerance 0.001 \
            --quantile-tolerance 0.05 \
            --consecutive-passes 2 \
            --output-dir artifacts/quadratic_logit_h0_calibration_pilot
      - name: Independently audit pairing, nested validation, child artifacts and summaries
        run: |
          python scripts/audit_quadratic_logit_h0_calibration_pilot.py \
            artifacts/quadratic_logit_h0_calibration_pilot \
            --output artifacts/quadratic_logit_h0_calibration_pilot/independent_orchestration_audit.json
      - name: Assert complete 90-cell pilot and successful independent audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("artifacts/quadratic_logit_h0_calibration_pilot")
          ledger=pd.read_csv(root/"replicate_ledger.csv")
          report=json.loads((root/"independent_orchestration_audit.json").read_text())
          assert len(ledger)==90
          assert report["status"]=="PASS"
          assert report["planned_cells"]==90
          assert report["status_counts"].get("FAILED",0)==0
          assert report["status_counts"].get("NOT_RUN",0)==0
          print(json.dumps(report,indent=2))
          PY
      - name: Upload complete pilot, raw child artifacts and failure ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-logit-h0-calibration-pilot-py3.12
          path: artifacts/quadratic_logit_h0_calibration_pilot/
          if-no-files-found: warn
          retention-days: 90
