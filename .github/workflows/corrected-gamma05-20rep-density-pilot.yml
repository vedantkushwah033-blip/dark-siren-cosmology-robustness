name: corrected-gamma05-20rep-density-pilot

on:
  push:
    branches:
      - research/gamma05-20rep-density-pilot-20261118

permissions:
  contents: read

concurrency:
  group: corrected-gamma05-20rep-density-pilot
  cancel-in-progress: false

jobs:
  gamma05-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run 20-replicate corrected gamma=0.5 density pilot
        run: |
          python scripts/run_absolute_bandwidth_density_replicates.py \
            --master-seed 2026111900 \
            --seed-stride 10 \
            --replicates 20 \
            --n-parent 4000 \
            --validation-frame 1500 \
            --validation-sizes 100,300,1000 \
            --gamma 0.5 \
            --beta -3.9 \
            --scott-multiplier 0.7 \
            --quadrature-order 5 \
            --grid-points 401 \
            --absolute-widths 0.012,0.016,0.020,0.024,0.028,0.032,0.040 \
            --output-dir artifacts/gamma05_20rep_density_pilot
      - name: Independently audit all 20 raw replicates and aggregate outputs
        run: |
          python scripts/audit_absolute_bandwidth_density_replicates.py \
            artifacts/gamma05_20rep_density_pilot \
            --output artifacts/gamma05_20rep_density_pilot/outer_independent_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/gamma05_20rep_density_pilot/outer_independent_audit.json")
          report = json.loads(p.read_text())
          print(json.dumps(report, indent=2, sort_keys=True))
          assert report.get("status") == "PASS", report
          assert report.get("planned_replicates") == 20, report
          assert report.get("successful_replicates") == 20, report
          assert report.get("failed_replicates") == 0, report
          assert report.get("child_raw_audits_passed") == 20, report
          PY
      - name: Upload all raw inputs, replicate outputs, manifests, and audit
        uses: actions/upload-artifact@v4
        with:
          name: corrected-gamma05-20rep-density-pilot-${{ github.sha }}
          path: artifacts/gamma05_20rep_density_pilot/
          if-no-files-found: error
          retention-days: 30
