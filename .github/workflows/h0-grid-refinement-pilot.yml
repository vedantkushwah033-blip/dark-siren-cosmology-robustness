name: h0-grid-refinement-pilot

on:
  push:
    branches:
      - research/h0-calibration-nested-audit-fix-20261119
    paths:
      - .github/workflows/h0-grid-refinement-pilot.yml
      - scripts/run_h0_grid_refinement_pilot.py
      - scripts/run_quadratic_logit_inclusion_h0_smoke.py
      - scripts/audit_quadratic_logit_inclusion_h0_smoke.py
      - src/dark_siren_robustness/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paired-grid-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test H0-grid refinement audit helpers
        run: python -m pytest -q tests/test_h0_grid_refinement_pilot.py
      - name: Download archived fixed-truth 90-cell baseline
        uses: actions/download-artifact@v4
        with:
          name: quadratic-logit-h0-calibration-pilot-py3.12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44402834830
          path: artifacts/h0_calibration_baseline
      - name: Run paired H0-grid refinement on first three archived replicates
        run: |
          python scripts/run_h0_grid_refinement_pilot.py \
            --baseline-dir artifacts/h0_calibration_baseline \
            --output-dir artifacts/h0_grid_refinement_pilot \
            --replicates 3 \
            --grid-points 281,561
      - name: Assert all refined child runs and paired comparisons completed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/h0_grid_refinement_pilot/grid_refinement_report.json").read_text())
          assert report["status"] == "PASS", report
          assert report["planned_refined_runs"] == 54, report
          assert report["successful_refined_runs"] == 54, report
          assert report["failed_refined_runs"] == 0, report
          print(json.dumps(report, indent=2))
          PY
      - name: Upload raw grid-refinement runs and comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-h0-grid-refinement-pilot
          path: artifacts/h0_grid_refinement_pilot/
          if-no-files-found: warn
          retention-days: 90
