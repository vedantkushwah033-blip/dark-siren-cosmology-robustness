name: Targeted adaptive-CDF audit for full-parent SBC tails

on:
  push:
    branches:
      - research/adaptive-h0-sbc-tail-audit-20261119
  pull_request:
    branches:
      - research/full-parent-joint-sbc-baseline-20261119
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: adaptive-h0-sbc-tail-audit-20261119
  cancel-in-progress: false

jobs:
  adaptive-tail-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile and test adaptive integration
        run: |
          python -m py_compile scripts/audit_full_parent_h0_sbc_adaptive.py
          pytest -q tests/test_full_parent_h0_sbc_adaptive.py
      - name: Verify immutable 200-replicate source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(gh api repos/vedantkushwah033-blip/dark-siren-cosmology-robustness/actions/runs/44440150116 --jq '.status + ":" + (.conclusion // "")')
          test "$result" = "completed:success"
      - name: Download immutable 200-replicate source artifact
        uses: actions/download-artifact@v4
        with:
          name: full-parent-h0-sbc
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: vedantkushwah033-blip/dark-siren-cosmology-robustness
          run-id: 44440150116
          path: artifacts/full_parent_h0_sbc
      - name: Independently reconstruct selected boundary-dominated replicates with adaptive CDF integration
        run: |
          python scripts/audit_full_parent_h0_sbc_adaptive.py artifacts/full_parent_h0_sbc \
            --replicates 100 174 156 62 \
            --grid-points 4481 \
            --output artifacts/full_parent_h0_sbc_adaptive_tail_audit_4481.json
      - name: Upload adaptive-CDF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-parent-h0-sbc-adaptive-tail-audit
          path: artifacts/full_parent_h0_sbc_adaptive_tail_audit.json
          if-no-files-found: warn
          retention-days: 90
