name: Toy selection paired fixed-truth comparison

on:
  push:
    branches: [main]
    paths:
      - "src/dark_siren_robustness/selection.py"
      - "src/dark_siren_robustness/hardened_inference.py"
      - "scripts/run_selection_paired_comparison.py"
      - "tests/test_selection_paired_comparison.py"
      - ".github/workflows/selection-paired-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run paired fixed-truth comparison
        run: python scripts/run_selection_paired_comparison.py --replicates-per-truth 600 --seed 20261028 --grid-size 2001 --output-dir results/selection-paired-comparison
      - name: Validate outputs
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root = Path("results/selection-paired-comparison")
          with (root / "per_run.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          with (root / "summary.csv").open(newline="") as f:
              summaries = list(csv.DictReader(f))
          if len(rows) != 1800 or len(summaries) != 8:
              raise SystemExit(f"Unexpected output dimensions: {len(rows)} runs, {len(summaries)} summaries")
          for row in rows:
              d = float(row["observed_distance_mpc"])
              if not (0 < d < 180):
                  raise SystemExit("Generated observation outside detection interval")
              for key in ("uncorrected_median", "corrected_median", "paired_abs_error_change_corrected_minus_uncorrected"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite per-run metric: {key}")
          for row in summaries:
              for key in ("bias", "rmse", "coverage_68", "coverage_95", "mean_width_68", "mean_width_95"):
                  if not math.isfinite(float(row[key])):
                      raise SystemExit(f"Non-finite summary metric: {key}")
          print("PASS: paired outputs contain 1,800 observations and 8 summaries.")
          PY
      - name: Upload comparison outputs
        uses: actions/upload-artifact@v4
        with:
          name: selection-paired-comparison-results
          path: results/selection-paired-comparison/
          if-no-files-found: error
          retention-days: 90
