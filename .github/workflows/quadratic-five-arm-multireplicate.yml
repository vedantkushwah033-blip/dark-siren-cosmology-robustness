name: quadratic-five-arm-multireplicate

on:
  push:
    branches:
      - research/quadratic-five-arm-30event-smoke-20261119
    paths:
      - .github/workflows/quadratic-five-arm-multireplicate.yml
      - scripts/run_quadratic_five_arm_replicates.py
      - scripts/audit_quadratic_five_arm_replicates.py
      - scripts/run_quadratic_five_arm_smoke.py
      - scripts/audit_quadratic_five_arm_smoke.py
      - tests/test_quadratic_five_arm_replicates.py
      - src/dark_siren_robustness/**
  workflow_dispatch:

concurrency:
  group: quadratic-five-arm-multireplicate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-30-event-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile orchestration and auditor; run regression tests
        run: |
          python -m py_compile \
            scripts/run_quadratic_five_arm_replicates.py \
            scripts/audit_quadratic_five_arm_replicates.py \
            scripts/run_quadratic_five_arm_smoke.py \
            scripts/audit_quadratic_five_arm_smoke.py
          pytest tests/test_quadratic_five_arm_replicates.py \
            tests/test_quadratic_five_arm_smoke.py -q
      - name: Run paired 10-replicate, 30-event, five-arm experiment
        run: |
          python scripts/run_quadratic_five_arm_replicates.py \
            --master-seed 2026111929 \
            --replicates 10 \
            --gammas=-1,0,1 \
            --n-parent 1200 \
            --n-detected 30 \
            --validation-frame 500 \
            --validation-sizes 100,300,500 \
            --curvature-beta -3.9 \
            --h0-true 70 \
            --h0-points 281 \
            --scott-multiplier 0.7 \
            --quadrature-order 5 \
            --sigma-mpc 140 \
            --detection-threshold-mpc 250 \
            --output-dir artifacts/quadratic_five_arm_30event_multireplicate
      - name: Independently audit pairing, child artifacts, aggregates and failure ledger
        if: always()
        run: |
          if [ -f artifacts/quadratic_five_arm_30event_multireplicate/replicate_ledger.csv ]; then
            python scripts/audit_quadratic_five_arm_replicates.py \
              artifacts/quadratic_five_arm_30event_multireplicate \
              --output artifacts/quadratic_five_arm_30event_multireplicate/independent_orchestration_audit.json
          fi
      - name: Assert complete planned denominator and report statuses
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("artifacts/quadratic_five_arm_30event_multireplicate")
          ledger=pd.read_csv(root/"replicate_ledger.csv")
          report=json.loads((root/"independent_orchestration_audit.json").read_text())
          assert len(ledger)==450, len(ledger)
          assert report["status"]=="PASS", report
          assert report["planned_cells"]==450
          assert report["status_counts"].get("NOT_RUN",0)==0
          print(json.dumps(report,indent=2))
          print(ledger.status.value_counts().to_string())
          print(pd.read_csv(root/"aggregate_metrics.csv").to_string(index=False))
          PY
      - name: Upload complete or partial paired five-arm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-five-arm-30event-multireplicate
          path: artifacts/quadratic_five_arm_30event_multireplicate/
          if-no-files-found: warn
          retention-days: 90
