name: expanded-bandwidth-cross-gamma-audit

on:
  push:
    branches:
      - research/expanded-bandwidth-cross-gamma-audit-20261119
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: expanded-bandwidth-cross-gamma-audit
  cancel-in-progress: false

jobs:
  cross-gamma-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download gamma -2
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-m2
          path: artifacts/gamma_m2
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Download gamma -1
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-m1
          path: artifacts/gamma_m1
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Download gamma -0.5
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-m05
          path: artifacts/gamma_m05
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Download gamma 0
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-zero
          path: artifacts/gamma_zero
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Download gamma +0.5
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-p05
          path: artifacts/gamma_p05
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Download gamma +1
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-p1
          path: artifacts/gamma_p1
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Download gamma +2
        uses: actions/download-artifact@v4
        with:
          name: curvature-gamma-p2
          path: artifacts/gamma_p2
          github-token: ${{ github.token }}
          run-id: 44367512399
      - name: Independently audit expanded-bandwidth paired design
        run: |
          python scripts/audit_quadratic_logit_curvature_pilot.py artifacts \
            --output-dir expanded_bandwidth_summary
      - name: Upload expanded-bandwidth audit and paired summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-bandwidth-cross-gamma-summary
          path: expanded_bandwidth_summary
          if-no-files-found: warn
          retention-days: 30
